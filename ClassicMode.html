<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BulletDasher - Classic Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            transition: background-color 0.05s ease;
        }
        
        body.damage-flash {
            background-color: #ff0000 !important;
        }
        
        canvas {
            border: 2px solid white;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
            cursor: none;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: lime;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            font-size: 14px;
        }
        
        .controls-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            font-size: 12px;
            padding: 5px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }
        
        .restart-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: gray;
            background: rgba(0,0,0,0.5);
            font-size: 11px;
            padding: 5px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }

        .mobile-hidden { display: none !important; }

        #musicToggle {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 70;
            border: 1px solid white;
            cursor: pointer;
        }

        #musicToggle:hover {
            background: rgba(255,255,255,0.2);
        }

        #fullscreenBtn {
            position: absolute;
            top: 10px;
            right: 150px;
            color: white;
            background: rgba(0,0,0,0.7);
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 70;
            border: 1px solid white;
            cursor: pointer;
        }

        #fullscreenBtn:hover {
            background: rgba(255,255,255,0.2);
        }

        #fullscreenBtn.hidden { display: none !important; }

        .hidden {
            display: none !important;
        }

        .neon-btn {
            position: relative;
            background: rgba(255,0,0,0.08);
            color: #ff4444;
            border: 2px solid #ff0000;
            padding: 16px 55px;
            font-size: 22px;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 3px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,0,0,0.6), inset 0 0 10px rgba(255,0,0,0.25);
            text-shadow: 0 0 8px #ff0000;
            transition: all 0.2s ease;
        }

        .neon-btn:hover {
            background: rgba(255,0,0,0.22);
            box-shadow: 0 0 22px rgba(255,0,0,0.9), inset 0 0 15px rgba(255,0,0,0.4);
            transform: scale(1.05);
            color: #ffaaaa;
        }

        #menuBtn {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            padding: 10px 28px;
            font-size: 13px;
        }

        #menuBtn:hover {
            transform: translateX(-50%) scale(1.05);
        }

        /* ---------- CONTROLES MÓVILES ---------- */
        #mobileControls {
            position: fixed;
            inset: 0;
            z-index: 60;
            pointer-events: none;
        }

        #mobileControls.hidden { display: none !important; }

        #joystickZone {
            position: absolute;
            left: 20px;
            bottom: 20px;
            width: 130px;
            height: 130px;
            pointer-events: auto;
            touch-action: none;
        }

        #joystickBase {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            border: 2px solid rgba(0,255,255,0.55);
            box-shadow: 0 0 15px rgba(0,255,255,0.3), inset 0 0 15px rgba(0,255,255,0.15);
        }

        #joystickKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 54px;
            height: 54px;
            margin-left: -27px;
            margin-top: -27px;
            border-radius: 50%;
            background: rgba(0,255,255,0.55);
            box-shadow: 0 0 12px rgba(0,255,255,0.9);
        }

        #swipeZone {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
        }
    </style>
<script src="highscores.js"></script>
<script src="cosmetics.js"></script>
<script src="achievements.js"></script>
</head>
<body>
<div id="ui" class="hidden">
    ❤️ VIDA: <span id="hp">3</span> | 🎯 SCORE: <span id="score">0</span><br>
    ⏱️ Tiempo: <span id="gameTime">0:00</span> | ☠️ Extinciones: <span id="extinctionCount">0</span>
</div>
<div class="controls-info hidden">
    🎮 WASD = mover | ⚡ FLECHAS = dash (atraviesa y mata enemigos, deja vida) | 📱 Joystick + desliza a la derecha para dash
</div>
<div class="restart-hint hidden">
    💀 GAME OVER → Presiona ESPACIO para reiniciar
</div>
<button id="musicToggle" class="hidden">🎵 Música: ON</button>
<button id="fullscreenBtn" class="hidden">⛶ Pantalla completa</button>
<button id="menuBtn" class="neon-btn hidden">🏠 Menú Principal</button>
<canvas id="gameCanvas" width="1100" height="750" class="hidden"></canvas>

<div id="mobileControls" class="hidden">
    <div id="joystickZone">
        <div id="joystickBase">
            <div id="joystickKnob"></div>
        </div>
    </div>
    <div id="swipeZone"></div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bodyElement = document.body;

        // ---------- CONTROL DE PANTALLA DE JUEGO ----------
        const menuBtn = document.getElementById('menuBtn');
        const gameScreenElements = [
            document.getElementById('ui'),
            document.querySelector('.controls-info'),
            document.querySelector('.restart-hint'),
            document.getElementById('musicToggle'),
            canvas
        ];

        // En ClassicMode.html el juego arranca directo, sin overlay de menú
        let inMenu = false;

        // ---------- DETECCIÓN DE MÓVIL Y CONTROLES TÁCTILES ----------
        const isMobile = (('ontouchstart' in window) || navigator.maxTouchPoints > 0)
            && window.matchMedia('(pointer: coarse)').matches;

        const mobileControls = document.getElementById('mobileControls');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        if(isMobile) {
            // En celu este texto estorba y no aplica (no hay teclado) - se oculta siempre
            document.querySelector('.controls-info').classList.add('mobile-hidden');
            document.querySelector('.restart-hint').classList.add('mobile-hidden');
        }

        // ---------- ESCALAR CANVAS EN CELU (sin estirar, centrado) ----------
        function resizeCanvasForMobile() {
            if(!isMobile) return;
            const availW = window.innerWidth;
            const availH = window.innerHeight;
            const scale = Math.min(availW / canvas.width, availH / canvas.height);
            canvas.style.width = (canvas.width * scale) + 'px';
            canvas.style.height = (canvas.height * scale) + 'px';
        }

        if(isMobile) {
            fullscreenBtn.classList.remove('hidden');
            resizeCanvasForMobile();
            window.addEventListener('resize', resizeCanvasForMobile);
            window.addEventListener('orientationchange', resizeCanvasForMobile);
        }

        function toggleFullscreen() {
            const el = document.documentElement;
            if(!document.fullscreenElement && !document.webkitFullscreenElement) {
                if(el.requestFullscreen) el.requestFullscreen().catch(() => {});
                else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } else {
                if(document.exitFullscreen) document.exitFullscreen();
                else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function updateFullscreenBtnUI() {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
            fullscreenBtn.textContent = isFs ? "✕ Salir pantalla completa" : "⛶ Pantalla completa";
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', () => { updateFullscreenBtnUI(); resizeCanvasForMobile(); });
        document.addEventListener('webkitfullscreenchange', () => { updateFullscreenBtnUI(); resizeCanvasForMobile(); });

        function showGameScreen() {
            inMenu = false;
            gameScreenElements.forEach(el => el.classList.remove('hidden'));
            if(isMobile) mobileControls.classList.remove('hidden');
        }

        function goToMainMenu() {
            stopMusic();
            window.location.href = 'index.html';
        }

        menuBtn.addEventListener('click', goToMainMenu);
        
        // ---------- AUDIO ----------
        let backgroundMusic = null;
        let musicInitialized = false;
        let musicLoopWatcher = null; // logro "Classical Music": se arma en initMusic()
        
        function initMusic() {
            if (musicInitialized) return;
            try {
                backgroundMusic = new Audio('musicabullet.mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = 0.7;
                musicLoopWatcher = Achievements.watchMusicLoop(backgroundMusic, 'classical-music', Achievements.MODES.CLASSIC, () => {
                    if (!tookDamageThisRun) Achievements.tryUnlock('dash-god', Achievements.MODES.CLASSIC);
                });
                if (!musicMuted) {
                    backgroundMusic.play().catch(e => console.log("Esperando interacción para reproducir música"));
                }
                musicInitialized = true;
            } catch(e) { console.log("No se pudo cargar musicabullet.mp3", e); }
        }
        
        function restartMusic() {
            if (backgroundMusic) {
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
                if (musicLoopWatcher) musicLoopWatcher.reset(); // este reinicio manual no cuenta como vuelta real
                if (!musicMuted) {
                    backgroundMusic.play().catch(e => console.log("No se pudo reproducir música", e));
                }
            } else {
                initMusic();
            }
        }
        
        function stopMusic() {
            if (backgroundMusic) {
                backgroundMusic.pause();
            }
        }
        
        // ---------- MUTE SOLO MÚSICA (no afecta efectos de sonido) ----------
        let musicMuted = false;
        const musicToggleBtn = document.getElementById('musicToggle');
        
        function updateMusicToggleUI() {
            musicToggleBtn.textContent = musicMuted ? "🔇 Música: OFF" : "🎵 Música: ON";
        }
        
        function toggleMusic() {
            musicMuted = !musicMuted;
            if (backgroundMusic) {
                if (musicMuted) {
                    backgroundMusic.pause();
                } else if (!gameOver) {
                    backgroundMusic.play().catch(e => {});
                }
            }
            updateMusicToggleUI();
        }
        
        musicToggleBtn.addEventListener('click', toggleMusic);
        
        function playDamageSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.frequency.value = 220;
                gainNode.gain.value = 0.3;
                
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                oscillator.stop(audioCtx.currentTime + 0.3);
                
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) { console.log("Audio no soportado"); }
        }
        
        function playHealSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.frequency.value = 523.25; // Do agudo
                gainNode.gain.value = 0.2;
                
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
                oscillator.stop(audioCtx.currentTime + 0.2);
                
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) { console.log("Audio no soportado"); }
        }
        
        // DESTELLO ROJO
        let damageFlashTimer = 0;
        function triggerDamageFlash() {
            bodyElement.classList.add('damage-flash');
            damageFlashTimer = 6;
            playDamageSound();
        }
        
        function updateDamageFlash() {
            if (damageFlashTimer > 0) {
                damageFlashTimer--;
                if (damageFlashTimer <= 0) {
                    bodyElement.classList.remove('damage-flash');
                }
            }
        }
        
        // ---------- DASH LASER ----------
        let dashTrail = { active: false, x1: 0, y1: 0, x2: 0, y2: 0, timer: 0 };
        const MODE_DASH_COLOR = '#00ffff'; // color neón del dash en este modo — usado por los cosméticos
        const DASH_TRAIL_DURATION = 8; // frames que dura el laser visible
        
        // Items de curación (cuadritos verdes)
        let healthItems = []; // { x, y, size, timer }
        const HEALTH_ITEM_DURATION = 180; // 3 segundos a 60fps
        const HEALTH_ITEM_SIZE = 10;
        
        // ---------- PARÁMETROS ----------
        let hp = 3;
        let score = 0;
        let gameOver = false;
        let timeScoreCounter = 0; // frames acumulados para el puntaje por tiempo
        const FRAMES_PER_SECOND = 60;
        const TIME_SCORE_AMOUNT = 5; // puntos que suma cada segundo sobrevivido
        let gameTimeFrames = 0; // frames transcurridos de partida (para el HUD de tiempo)
        
        function formatGameTime(frames) {
            const totalSeconds = Math.floor(frames / FRAMES_PER_SECOND);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }
        
        // Jugador
        let player = { x: canvas.width/2, y: canvas.height/2, size: 18, invincible: 0 };
        let move = { up: false, down: false, left: false, right: false };
        let dashCooldown = 0;
        const DASH_SHORT = 80;
        const DASH_COOLDOWN_MAX = 15;
        let dashIframes = 0; // logro "Holy Frame": frames de invuln que vienen específicamente del dash
        
        // EVENTO SOMBRA GLOBAL
        let shadowEvent = { active: false, safeZone: { x: 0, y: 0, radius: 100 }, timer: 0, phase: 0, everSafe: false };
        let extinctionCount = 0; // veces que ha terminado el evento sombra (Extinciones)
        
        // Listas de enemigos
        let slowEnemies = [];
        let bulletEnemies = [];
        let lasers = [];
        
        // ---- Estado de logros (por partida) ----
        let tookDamageThisRun = false; // logro "Dash God": ni un solo golpe en toda la partida
        let purpKillsThisRun = 0;      // logro "Purpnocide": Purps matados por dash en esta partida
        let purpItemsEatenThisRun = 0; // cajitas de vida de Purps ya comidas
        let purpnocideMissed = false;  // se puso true si se dejó expirar una cajita de un Purp
        
        // Temporizadores
        let slowSpawnTimer = 0;
        let bulletSpawnTimer = 0;
        let laserSpawnTimer = 0;
        let shadowEventTimer = 0;
        
        // ---------- FUNCIONES AUX ----------
        function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
        
        function updateUI() {
            document.getElementById('hp').innerText = hp;
            document.getElementById('score').innerText = score;
            
            document.getElementById('extinctionCount').innerText = extinctionCount;
        }
        
        function healPlayer() {
            if (hp < 3) {
                hp++;
                updateUI();
                playHealSound();
                return true;
            }
            return false;
        }
        
        function damagePlayer() {
            if(player.invincible > 0 || gameOver) return;
            hp--;
            tookDamageThisRun = true; // logro "Dash God": ya no se puede conseguir esta partida
            Cosmetics.onPlayerHit(player.x, player.y); // skin-hit-rings
            triggerDamageFlash();
            updateUI();
            if(hp <= 0) {
                gameOver = true;
                hp = 0;
                updateUI();
                stopMusic();
                menuBtn.classList.remove('hidden');
                BulletDasherScores.save('classic', score);
            } else {
                player.invincible = 20;
            }
        }
        
        function addScore(amount) {
            score += amount;
            updateUI();
        }
        
        function spawnHealthItem(x, y, fromSniperKill, fromPurpKill) {
            healthItems.push({
                x: x, y: y,
                size: HEALTH_ITEM_SIZE,
                timer: HEALTH_ITEM_DURATION,
                fromSniperKill: !!fromSniperKill, // logro "SniperOfSnipers": hay que comerse esta cajita puntual
                fromPurpKill: !!fromPurpKill       // logro "Purpnocide": cajita dejada por un Purp
            });
        }
        
        // Matar enemigo y posiblemente soltar vida si fue por dash.
        // sourceKind identifica si el muerto era un Redst (bulletEnemy) y en qué estado:
        // 'redst-aiming' (todavía no empezó su trayecto) o 'redst-shooting' (ya viajando),
        // o 'purp' si era un enemigo lento (Purp, logro "Purpnocide").
        function killEnemy(enemy, isFromDash, enemyX, enemyY, sourceKind) {
            addScore(50);
            if (isFromDash) {
                if (sourceKind === 'redst-aiming') {
                    Achievements.tryUnlock('short-distance', Achievements.MODES.CLASSIC);
                }
                if (sourceKind === 'purp') {
                    purpKillsThisRun++;
                }
                spawnHealthItem(enemyX, enemyY, sourceKind === 'redst-shooting', sourceKind === 'purp');
            }
        }
        
        function resetGame() {
            hp = 3;
            score = 0;
            gameOver = false;
            timeScoreCounter = 0;
            gameTimeFrames = 0;
            player.x = canvas.width/2;
            player.y = canvas.height/2;
            player.invincible = 0;
            dashCooldown = 0;
            dashIframes = 0;
            slowEnemies = [];
            bulletEnemies = [];
            lasers = [];
            healthItems = [];
            Cosmetics.resetEffects();
            dashTrail.active = false;
            shadowEvent.active = false;
            shadowEvent.phase = 0;
            shadowEvent.everSafe = false;
            extinctionCount = 0;
            tookDamageThisRun = false;
            purpKillsThisRun = 0;
            purpItemsEatenThisRun = 0;
            purpnocideMissed = false;
            updateUI();
            document.getElementById('gameTime').innerText = formatGameTime(0);
            menuBtn.classList.add('hidden');
            restartMusic();
        }
        
        // Spawn de GRUPO de enemigos lentos
        function spawnSlowEnemyGroup() {
            let count = Math.floor(Math.random() * 3) + 3;
            for(let g=0; g<count; g++) {
                let side = Math.floor(Math.random() * 4);
                let x, y;
                if(side === 0) { x = Math.random() * canvas.width; y = -30; }
                else if(side === 1) { x = canvas.width + 30; y = Math.random() * canvas.height; }
                else if(side === 2) { x = Math.random() * canvas.width; y = canvas.height + 30; }
                else { x = -30; y = Math.random() * canvas.height; }
                
                slowEnemies.push({
                    x: x, y: y, size: 14,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    maxSpeed: 2.0
                });
            }
        }
        
        // Spawn de GRUPO de proyectiles rápidos
        function spawnBulletEnemyGroup() {
            let count = Math.floor(Math.random() * 3) + 2;
            for(let g=0; g<count; g++) {
                let angle = Math.random() * Math.PI * 2;
                let distance = 350 + Math.random() * 100;
                let x = player.x + Math.cos(angle) * distance;
                let y = player.y + Math.sin(angle) * distance;
                x = clamp(x, 40, canvas.width - 40);
                y = clamp(y, 40, canvas.height - 40);
                
                bulletEnemies.push({
                    x: x, y: y, size: 10,
                    state: 'aiming',
                    aimTimer: 35,
                    targetX: player.x, targetY: player.y,
                    vx: 0, vy: 0
                });
            }
        }
        
        // Laser
        function spawnLaser() {
            let edge = Math.floor(Math.random() * 4);
            let fromX, fromY, toX, toY, pattern;
            pattern = Math.floor(Math.random() * 3);
            
            if(edge === 0) {
                fromX = Math.random() * canvas.width;
                fromY = 0;
                if(pattern === 0) { toX = fromX; toY = canvas.height; }
                else if(pattern === 1) { toX = fromX + 250; toY = 0; }
                else { toX = fromX - 200; toY = canvas.height; }
            } else if(edge === 1) {
                fromX = canvas.width;
                fromY = Math.random() * canvas.height;
                if(pattern === 0) { toX = 0; toY = fromY; }
                else if(pattern === 1) { toX = canvas.width; toY = fromY + 250; }
                else { toX = 0; toY = fromY - 200; }
            } else if(edge === 2) {
                fromX = Math.random() * canvas.width;
                fromY = canvas.height;
                if(pattern === 0) { toX = fromX; toY = 0; }
                else if(pattern === 1) { toX = fromX - 250; toY = canvas.height; }
                else { toX = fromX + 200; toY = 0; }
            } else {
                fromX = 0;
                fromY = Math.random() * canvas.height;
                if(pattern === 0) { toX = canvas.width; toY = fromY; }
                else if(pattern === 1) { toX = 0; toY = fromY - 250; }
                else { toX = canvas.width; toY = fromY + 200; }
            }
            
            lasers.push({
                x1: fromX, y1: fromY, x2: toX, y2: toY,
                charge: 45,
                lifetime: 40,
                pattern: pattern
            });
        }
        
        // SOMBRA GLOBAL
        function startShadowEvent() {
            if(shadowEvent.active) return;
            shadowEvent.active = true;
            shadowEvent.phase = 1;
            shadowEvent.everSafe = false; // logro "Too Slow!": ¿el jugador llegó a estar a salvo en algún momento?
            shadowEvent.timer = 240;
            shadowEvent.safeZone = {
                x: Math.random() * (canvas.width - 200) + 100,
                y: Math.random() * (canvas.height - 200) + 100,
                radius: 90,
                vx: (Math.random() - 0.5) * 1.2,
                vy: (Math.random() - 0.5) * 1.2
            };
        }
        
        function updateShadowEvent() {
            if(!shadowEvent.active) return;
            
            if(shadowEvent.phase === 1) {
                shadowEvent.safeZone.x += shadowEvent.safeZone.vx;
                shadowEvent.safeZone.y += shadowEvent.safeZone.vy;
                if(shadowEvent.safeZone.x - shadowEvent.safeZone.radius < 0) shadowEvent.safeZone.vx = Math.abs(shadowEvent.safeZone.vx);
                if(shadowEvent.safeZone.x + shadowEvent.safeZone.radius > canvas.width) shadowEvent.safeZone.vx = -Math.abs(shadowEvent.safeZone.vx);
                if(shadowEvent.safeZone.y - shadowEvent.safeZone.radius < 0) shadowEvent.safeZone.vy = Math.abs(shadowEvent.safeZone.vy);
                if(shadowEvent.safeZone.y + shadowEvent.safeZone.radius > canvas.height) shadowEvent.safeZone.vy = -Math.abs(shadowEvent.safeZone.vy);
                
                // ¿El jugador está a salvo AHORA MISMO, mientras la zona todavía se mueve?
                // Si esto pasó alguna vez, "llegó a tiempo" — aunque la zona lo termine dejando
                // atrás al resolverse (logro "Too Slow!").
                if(Math.hypot(player.x - shadowEvent.safeZone.x, player.y - shadowEvent.safeZone.y) < shadowEvent.safeZone.radius) {
                    shadowEvent.everSafe = true;
                }
                
                shadowEvent.timer--;
                if(shadowEvent.timer <= 0) {
                    shadowEvent.phase = 2;
                    let distToSafe = Math.hypot(player.x - shadowEvent.safeZone.x, player.y - shadowEvent.safeZone.y);
                    if(distToSafe > shadowEvent.safeZone.radius) {
                        if (dashIframes > 0) {
                            Achievements.tryUnlock('holy-frame', Achievements.MODES.CLASSIC);
                        }
                        if (shadowEvent.everSafe) {
                            Achievements.tryUnlock('too-slow', Achievements.MODES.CLASSIC);
                        }
                        damagePlayer();
                    } else {
                        addScore(100);
                    }
                    for(let i=0; i<slowEnemies.length; i++) {
                        let e = slowEnemies[i];
                        let dist = Math.hypot(e.x - shadowEvent.safeZone.x, e.y - shadowEvent.safeZone.y);
                        if(dist > shadowEvent.safeZone.radius) {
                            slowEnemies.splice(i,1);
                            i--;
                        }
                    }
                    for(let i=0; i<bulletEnemies.length; i++) {
                        let b = bulletEnemies[i];
                        let dist = Math.hypot(b.x - shadowEvent.safeZone.x, b.y - shadowEvent.safeZone.y);
                        if(dist > shadowEvent.safeZone.radius) {
                            bulletEnemies.splice(i,1);
                            i--;
                        }
                    }
                    shadowEvent.active = false;
                    shadowEvent.phase = 0;
                    extinctionCount++;
                    updateUI();
                }
            }
        }
        
        // Movimiento del jugador
        function updatePlayerMovement() {
            let speed = 4.8;
            let dx = 0, dy = 0;
            if(move.up) dy -= 1;
            if(move.down) dy += 1;
            if(move.left) dx -= 1;
            if(move.right) dx += 1;

            if(joystick.active && (joystick.dx !== 0 || joystick.dy !== 0)) {
                // Movimiento analógico del joystick táctil (respeta magnitud parcial)
                dx = joystick.dx;
                dy = joystick.dy;
                let len = Math.hypot(dx, dy);
                if(len > 1) { dx /= len; dy /= len; }
                player.x += dx * speed;
                player.y += dy * speed;
            } else if(dx !== 0 || dy !== 0) {
                let len = Math.hypot(dx, dy);
                dx /= len;
                dy /= len;
                player.x += dx * speed;
                player.y += dy * speed;
            }
            
            player.x = clamp(player.x, player.size/2, canvas.width - player.size/2);
            player.y = clamp(player.y, player.size/2, canvas.height - player.size/2);
        }
        
        // Función para verificar si un punto está cerca de un segmento (para el laser de dash)
        function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            const ax = px - x1;
            const ay = py - y1;
            const bx = x2 - x1;
            const by = y2 - y1;
            const dot = ax * bx + ay * by;
            const len2 = bx * bx + by * by;
            if (len2 === 0) return Math.hypot(px - x1, py - y1);
            let t = dot / len2;
            t = Math.max(0, Math.min(1, t));
            const closestX = x1 + t * bx;
            const closestY = y1 + t * by;
            return Math.hypot(px - closestX, py - closestY);
        }
        
        // DASH con laser y muerte de enemigos atravesados
        function performDash(dirX, dirY) {
            if(dashCooldown > 0 || gameOver) return;
            if(dirX === 0 && dirY === 0) return;
            let len = Math.hypot(dirX, dirY);
            dirX /= len;
            dirY /= len;
            
            let dashDistance = DASH_SHORT;
            
            const startX = player.x;
            const startY = player.y;
            const endX = clamp(player.x + dirX * dashDistance, player.size/2, canvas.width - player.size/2);
            const endY = clamp(player.y + dirY * dashDistance, player.size/2, canvas.height - player.size/2);
            
            // ACTIVAR EL LASER DE DASH (destello)
            dashTrail.active = true;
            dashTrail.x1 = startX;
            dashTrail.y1 = startY;
            dashTrail.x2 = endX;
            dashTrail.y2 = endY;
            dashTrail.timer = DASH_TRAIL_DURATION;
            Cosmetics.triggerDashBorderGlow(MODE_DASH_COLOR); // skin-border-glow
            
            // MATAR ENEMIGOS QUE EL LASER ATRAVIESA
            // Enemigos lentos
            for(let i=0; i<slowEnemies.length; i++) {
                let e = slowEnemies[i];
                let distToLaser = pointToSegmentDistance(e.x, e.y, startX, startY, endX, endY);
                if(distToLaser < e.size/2 + 8) {
                    let enemyX = e.x, enemyY = e.y;
                    slowEnemies.splice(i,1);
                    killEnemy(null, true, enemyX, enemyY, 'purp');
                    i--;
                }
            }
            
            // Enemigos rápidos (proyectiles) — Redst. Si el láser lo atraviesa mientras
            // todavía está "aiming" (no arrancó su trayecto) => ShortDistance.
            // Si lo atraviesa ya "shooting" (en pleno trayecto) => deja la cajita marcada
            // para SniperOfSnipers (que se confirma al comerla, no al matar).
            for(let i=0; i<bulletEnemies.length; i++) {
                let b = bulletEnemies[i];
                let distToLaser = pointToSegmentDistance(b.x, b.y, startX, startY, endX, endY);
                if(distToLaser < b.size/2 + 3) {
                    let enemyX = b.x, enemyY = b.y;
                    let sourceKind = (b.state === 'aiming') ? 'redst-aiming' : 'redst-shooting';
                    bulletEnemies.splice(i,1);
                    killEnemy(null, true, enemyX, enemyY, sourceKind);
                    i--;
                }
            }
            
            // LOGRO "Yujiro Hanma": atravesar 2+ láseres YA DISPARANDO (charge<=0, en su tramo
            // que sí hace daño) en un solo dash. Se cuenta con intersección real de segmentos,
            // no solo distancia, porque el láser es una línea larga y el dash otra.
            let lasersCrossedThisDash = 0;
            for(let i=0; i<lasers.length; i++) {
                let l = lasers[i];
                if(l.charge > 0) continue; // todavía cargando (advertencia), no cuenta
                if(segmentsIntersect(startX, startY, endX, endY, l.x1, l.y1, l.x2, l.y2)) {
                    lasersCrossedThisDash++;
                }
            }
            if(lasersCrossedThisDash >= 2) {
                Achievements.tryUnlock('yujiro-hanma', Achievements.MODES.CLASSIC);
            }
            
            // Mover al jugador
            player.x = endX;
            player.y = endY;
            
            dashCooldown = DASH_COOLDOWN_MAX;
            player.invincible = 8;
            dashIframes = 8;
        }
        
        // Test estándar de intersección entre dos segmentos (para el logro Yujiro Hanma)
        function segmentsIntersect(ax1, ay1, ax2, ay2, bx1, by1, bx2, by2) {
            function cross(ox, oy, ax, ay, bx, by) { return (ax - ox) * (by - oy) - (ay - oy) * (bx - ox); }
            const d1 = cross(bx1, by1, bx2, by2, ax1, ay1);
            const d2 = cross(bx1, by1, bx2, by2, ax2, ay2);
            const d3 = cross(ax1, ay1, ax2, ay2, bx1, by1);
            const d4 = cross(ax1, ay1, ax2, ay2, bx2, by2);
            return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
        }
        
        // Actualizar items de curación
        function updateHealthItems() {
            for(let i=0; i<healthItems.length; i++) {
                let item = healthItems[i];
                item.timer--;
                if(item.timer <= 0) {
                    if (item.fromPurpKill) purpnocideMissed = true; // se dejó vencer una cajita de Purp
                    healthItems.splice(i,1);
                    i--;
                    continue;
                }
                // Colisión con jugador
                let dist = Math.hypot(player.x - item.x, player.y - item.y);
                if(dist < player.size/2 + item.size/2) {
                    healPlayer();
                    if (item.fromSniperKill) {
                        Achievements.tryUnlock('sniper-of-snipers', Achievements.MODES.CLASSIC);
                    }
                    if (item.fromPurpKill) {
                        purpItemsEatenThisRun++;
                        if (purpKillsThisRun >= 30 && !purpnocideMissed && purpItemsEatenThisRun >= purpKillsThisRun) {
                            Achievements.tryUnlock('purpnocide', Achievements.MODES.CLASSIC);
                        }
                    }
                    healthItems.splice(i,1);
                    i--;
                }
            }
        }
        
        // Actualizar dash trail
        function updateDashTrail() {
            if(dashTrail.active) {
                dashTrail.timer--;
                if(dashTrail.timer <= 0) {
                    dashTrail.active = false;
                }
            }
        }
        
        
        // Enemigos lentos
        function updateSlowEnemies() {
            for(let i=0; i<slowEnemies.length; i++) {
                let e = slowEnemies[i];
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let dist = Math.hypot(dx, dy);
                if(dist > 0.01) {
                    let dirX = dx / dist;
                    let dirY = dy / dist;
                    e.vx += dirX * 0.1;
                    e.vy += dirY * 0.1;
                    let spd = Math.hypot(e.vx, e.vy);
                    if(spd > e.maxSpeed) {
                        e.vx = (e.vx / spd) * e.maxSpeed;
                        e.vy = (e.vy / spd) * e.maxSpeed;
                    }
                }
                e.x += e.vx;
                e.y += e.vy;
                
                if(e.x + e.size/2 < -50 || e.x - e.size/2 > canvas.width+50 || 
                   e.y + e.size/2 < -50 || e.y - e.size/2 > canvas.height+50) {
                    slowEnemies.splice(i,1);
                    i--;
                    continue;
                }
                
                if(player.invincible === 0 && !gameOver && Math.hypot(player.x - e.x, player.y - e.y) < (player.size/2 + e.size/2)) {
                    damagePlayer();
                }
            }
        }
        
        // Proyectiles rápidos
        function updateBulletEnemies() {
            for(let i=0; i<bulletEnemies.length; i++) {
                let b = bulletEnemies[i];
                if(b.state === 'aiming') {
                    b.aimTimer--;
                    b.targetX = player.x;
                    b.targetY = player.y;
                    if(b.aimTimer <= 0) {
                        b.state = 'shooting';
                        let dx = player.x - b.x;
                        let dy = player.y - b.y;
                        let dist = Math.hypot(dx, dy);
                        if(dist > 0.01) {
                            let spd = 16;
                            b.vx = (dx / dist) * spd;
                            b.vy = (dy / dist) * spd;
                        }
                    }
                } else {
                    b.x += b.vx;
                    b.y += b.vy;
                    if(b.x + 50 < 0 || b.x - 50 > canvas.width || b.y + 50 < 0 || b.y - 50 > canvas.height) {
                        bulletEnemies.splice(i,1);
                        i--;
                        continue;
                    }
                    if(player.invincible === 0 && !gameOver && Math.hypot(player.x - b.x, player.y - b.y) < (player.size/2 + b.size/2)) {
                        damagePlayer();
                        bulletEnemies.splice(i,1);
                        i--;
                    }
                }
            }
        }
        
        // Lasers
        function updateLasers() {
            for(let i=0; i<lasers.length; i++) {
                let l = lasers[i];
                if(l.charge > 0) {
                    l.charge--;
                } else {
                    l.lifetime--;
                    if(l.lifetime <= 0) {
                        lasers.splice(i,1);
                        i--;
                        continue;
                    }
                    let closest = closestPointOnSegment(player.x, player.y, l.x1, l.y1, l.x2, l.y2);
                    let dist = Math.hypot(player.x - closest.x, player.y - closest.y);
                    if(dist < player.size/2 + 5 && player.invincible === 0 && !gameOver) {
                        damagePlayer();
                    }
                }
            }
        }
        
        function closestPointOnSegment(px, py, x1, y1, x2, y2) {
            let ax = px - x1, ay = py - y1;
            let bx = x2 - x1, by = y2 - y1;
            let dot = ax * bx + ay * by;
            let len2 = bx * bx + by * by;
            if(len2 === 0) return {x: x1, y: y1};
            let t = dot / len2;
            t = Math.max(0, Math.min(1, t));
            return {x: x1 + t * bx, y: y1 + t * by};
        }
        
        // Spawners
        function updateSpawners() {
            if(gameOver) return;
            
            if(slowSpawnTimer <= 0) { 
                spawnSlowEnemyGroup(); 
                slowSpawnTimer = 70; 
            } else slowSpawnTimer--;
            
            if(bulletSpawnTimer <= 0) { 
                spawnBulletEnemyGroup(); 
                bulletSpawnTimer = 90; 
            } else bulletSpawnTimer--;
            
            if(laserSpawnTimer <= 0) { 
                if(lasers.length < 6) {
                    spawnLaser();
                    // Pequeña chance de que salga un segundo laser junto (nunca pasa de 3 en pantalla)
                    if(lasers.length < 6 && Math.random() < 0.8) {
                        spawnLaser();
                    }
                }
                laserSpawnTimer = 15 + Math.floor(Math.random() * 20); // 15-35 frames (~0.9s-1.7s)
            } else laserSpawnTimer--;
            
            if(shadowEventTimer <= 0 && !shadowEvent.active) { 
                startShadowEvent(); 
                shadowEventTimer = 900;
            } else if(!shadowEvent.active) shadowEventTimer--;
        }
        
        // DIBUJADO
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            let gradient = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
            gradient.addColorStop(0, "#0a0a2a");
            gradient.addColorStop(1, "#1a0a2a");
            ctx.fillStyle = gradient;
            ctx.fillRect(0,0,canvas.width,canvas.height);
            
            // SOMBRA GLOBAL
            if(shadowEvent.active && shadowEvent.phase === 1) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.beginPath();
                ctx.arc(shadowEvent.safeZone.x, shadowEvent.safeZone.y, shadowEvent.safeZone.radius, 0, Math.PI*2);
                ctx.fillStyle = "rgba(255,255,200,0.4)";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(shadowEvent.safeZone.x, shadowEvent.safeZone.y, shadowEvent.safeZone.radius-5, 0, Math.PI*2);
                ctx.strokeStyle = "yellow";
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.fillStyle = "white";
                ctx.font = "bold 16px monospace";
                ctx.fillText("ZONA SEGURA", shadowEvent.safeZone.x-55, shadowEvent.safeZone.y-60);
            }
            
            // DASH LASER (destello de trayectoria)
            if(dashTrail.active) {
                const drewSegmented = Cosmetics.drawSegmentedDashTrail(ctx, dashTrail, MODE_DASH_COLOR);
                if(!drewSegmented) {
                    ctx.beginPath();
                    ctx.moveTo(dashTrail.x1, dashTrail.y1);
                    ctx.lineTo(dashTrail.x2, dashTrail.y2);
                    const intensity = 0.7 + Math.sin(Date.now() * 0.03) * 0.3;
                    ctx.strokeStyle = `rgba(0, 255, 255, ${intensity})`;
                    ctx.lineWidth = 8;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "cyan";
                    ctx.stroke();
                    // Línea interna más brillante
                    ctx.beginPath();
                    ctx.moveTo(dashTrail.x1, dashTrail.y1);
                    ctx.lineTo(dashTrail.x2, dashTrail.y2);
                    ctx.strokeStyle = `rgba(255, 255, 255, 0.9)`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }
            
            // Items de curación (cuadritos verdes)
            for(let item of healthItems) {
                const alpha = Math.min(1, item.timer / 30);
                ctx.fillStyle = `rgba(0, 255, 0, ${alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = "lime";
                ctx.fillRect(item.x - item.size/2, item.y - item.size/2, item.size, item.size);
                // Brillo interior
                ctx.fillStyle = `rgba(200, 255, 100, ${alpha})`;
                ctx.fillRect(item.x - item.size/4, item.y - item.size/4, item.size/2, item.size/2);
            }
            ctx.shadowBlur = 0;
            
            // Enemigos lentos (Purps)
            const purpColors = Cosmetics.getPurpColors("#b77eff", "#ffaaff");
            for(let e of slowEnemies) {
                ctx.fillStyle = purpColors.outer;
                ctx.shadowBlur = 5;
                ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
                ctx.fillStyle = purpColors.inner;
                ctx.fillRect(e.x - e.size/4, e.y - e.size/4, e.size/2, e.size/2);
            }
            
            // Proyectiles rápidos
            for(let b of bulletEnemies) {
                if(b.state === 'aiming') {
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    ctx.lineTo(b.targetX, b.targetY);
                    ctx.strokeStyle = `rgba(255,0,0,${0.5+Math.sin(Date.now()*0.01)*0.3})`;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([10,8]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = "#ff6666";
                } else {
                    ctx.fillStyle = "#ff3300";
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = "red";
                }
                ctx.fillRect(b.x - b.size/2, b.y - b.size/2, b.size, b.size);
            }
            
            // Lasers
            for(let l of lasers) {
                if(l.charge > 0) {
                    ctx.beginPath();
                    ctx.moveTo(l.x1, l.y1);
                    ctx.lineTo(l.x2, l.y2);
                    let intensity = 0.3 + (l.charge/45) * 0.5;
                    ctx.strokeStyle = `rgba(255,150,0,${intensity})`;
                    ctx.lineWidth = 8;
                    ctx.setLineDash([15,10]);
                    ctx.stroke();
                    let patternText = l.pattern === 0 ? "═" : (l.pattern === 1 ? "║" : "╱");
                    ctx.fillStyle = `rgba(255,200,0,${intensity+0.2})`;
                    ctx.font = "20px monospace";
                    ctx.fillText(patternText, (l.x1+l.x2)/2, (l.y1+l.y2)/2);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(l.x1, l.y1);
                    ctx.lineTo(l.x2, l.y2);
                    let color = l.pattern === 0 ? "#ff4444" : (l.pattern === 1 ? "#44ff44" : "#4444ff");
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 5;
                    ctx.setLineDash([]);
                    ctx.stroke();
                }
            }
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
            
            // Jugador
            if(player.invincible > 0 && (Math.floor(Date.now()/50)%2 === 0)) {
                ctx.fillStyle = "#ffffaa";
            } else {
                ctx.fillStyle = "#f0f0f0";
            }
            ctx.shadowBlur = 10;
            ctx.shadowColor = "white";
            ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
            ctx.fillStyle = "#ff8800";
            ctx.fillRect(player.x - player.size/4, player.y - player.size/4, player.size/2, player.size/2);

            // Mascotas y cosmético equipados
            Cosmetics.drawMascots(ctx, player.x, player.y, player.size);
            Cosmetics.drawCosmetic(ctx, player.x, player.y, player.size);
            
            // Dash cooldown
            if(dashCooldown > 0) {
                ctx.fillStyle = "rgba(0,255,255,0.6)";
                ctx.fillRect(10, canvas.height-30, (DASH_COOLDOWN_MAX-dashCooldown)*5, 10);
            }
            
            ctx.shadowBlur = 0;

            // Anillos del golpe y aura de borde al dashear (skins)
            Cosmetics.drawHitParticles(ctx);
            Cosmetics.drawDashBorderGlow(ctx, canvas);
            
            // Game over
            if(gameOver) {
                ctx.font = "bold 48px monospace";
                ctx.fillStyle = "red";
                ctx.fillText("GAME OVER", canvas.width/2-140, canvas.height/2-40);
                ctx.font = "20px monospace";
                ctx.fillStyle = "white";
                ctx.fillText("Presiona ESPACIO para reiniciar", canvas.width/2-165, canvas.height/2+30);
            }
        }
        
        // ACTUALIZACIÓN PRINCIPAL
        function update() {
            Cosmetics.updateEffects(canvas.width, canvas.height);
            if(gameOver) return;
            
            if(player.invincible > 0) player.invincible--;
            if(dashIframes > 0) dashIframes--;
            if(dashCooldown > 0) dashCooldown--;
            
            // Puntos por tiempo sobrevivido
            timeScoreCounter++;
            if(timeScoreCounter >= FRAMES_PER_SECOND) {
                timeScoreCounter -= FRAMES_PER_SECOND;
                addScore(TIME_SCORE_AMOUNT);
            }
            
            // Tiempo de partida (HUD)
            gameTimeFrames++;
            document.getElementById('gameTime').innerText = formatGameTime(gameTimeFrames);
            
            updatePlayerMovement();
            updateSlowEnemies();
            updateBulletEnemies();
            updateLasers();
            updateShadowEvent();
            updateSpawners();
            updateHealthItems();
            updateDashTrail();
            
            // Colisiones proyectil-enemigo lento
            for(let i=0; i<bulletEnemies.length; i++) {
                if(bulletEnemies[i].state === 'shooting') {
                    for(let j=0; j<slowEnemies.length; j++) {
                        if(Math.hypot(bulletEnemies[i].x - slowEnemies[j].x, bulletEnemies[i].y - slowEnemies[j].y) < 18) {
                            slowEnemies.splice(j,1);
                            addScore(50);
                            break;
                        }
                    }
                }
            }
            
            updateDamageFlash();
        }
        
        // ---------- INPUTS TÁCTILES (joystick + cruz de dash) ----------
        let joystick = { active: false, touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };
        const JOY_RADIUS = 40; // radio máximo de desplazamiento del knob (px)

        function updateJoystick(clientX, clientY, joystickKnob) {
            let dx = clientX - joystick.baseX;
            let dy = clientY - joystick.baseY;
            let dist = Math.hypot(dx, dy);
            if(dist > JOY_RADIUS) {
                dx = dx / dist * JOY_RADIUS;
                dy = dy / dist * JOY_RADIUS;
            }
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.dx = dx / JOY_RADIUS;
            joystick.dy = dy / JOY_RADIUS;
        }

        if(isMobile) {
            const joystickZone = document.getElementById('joystickZone');
            const joystickBase = document.getElementById('joystickBase');
            const joystickKnob = document.getElementById('joystickKnob');

            function resetJoystickKnob() {
                joystick.active = false;
                joystick.touchId = null;
                joystick.dx = 0;
                joystick.dy = 0;
                joystickKnob.style.transform = 'translate(0px, 0px)';
            }

            joystickZone.addEventListener('touchstart', (e) => {
                if(inMenu) return;
                if(gameOver) { resetGame(); e.preventDefault(); return; }
                const touch = e.changedTouches[0];
                joystick.active = true;
                joystick.touchId = touch.identifier;
                const rect = joystickBase.getBoundingClientRect();
                joystick.baseX = rect.left + rect.width/2;
                joystick.baseY = rect.top + rect.height/2;
                updateJoystick(touch.clientX, touch.clientY, joystickKnob);
                e.preventDefault();
            }, {passive:false});

            joystickZone.addEventListener('touchmove', (e) => {
                if(!joystick.active) return;
                for(const touch of e.changedTouches) {
                    if(touch.identifier === joystick.touchId) {
                        updateJoystick(touch.clientX, touch.clientY, joystickKnob);
                    }
                }
                e.preventDefault();
            }, {passive:false});

            const endJoystickTouch = (e) => {
                for(const touch of e.changedTouches) {
                    if(touch.identifier === joystick.touchId) {
                        resetJoystickKnob();
                    }
                }
                e.preventDefault();
            };
            joystickZone.addEventListener('touchend', endJoystickTouch, {passive:false});
            joystickZone.addEventListener('touchcancel', endJoystickTouch, {passive:false});

            // ---- Dash por deslizamiento (swipe) en el lado derecho de la pantalla ----
            const swipeZone = document.getElementById('swipeZone');
            const SWIPE_MIN_DIST = 45; // px mínimos para que cuente como dash (evita toques accidentales)
            let swipe = { active: false, touchId: null, startX: 0, startY: 0 };

            swipeZone.addEventListener('touchstart', (e) => {
                if(inMenu) return;
                if(gameOver) { resetGame(); e.preventDefault(); return; }
                const touch = e.changedTouches[0];
                swipe.active = true;
                swipe.touchId = touch.identifier;
                swipe.startX = touch.clientX;
                swipe.startY = touch.clientY;
                e.preventDefault();
            }, {passive:false});

            swipeZone.addEventListener('touchmove', (e) => {
                e.preventDefault(); // evita que la pantalla haga scroll al deslizar
            }, {passive:false});

            const finishSwipe = (e) => {
                if(!swipe.active) return;
                for(const touch of e.changedTouches) {
                    if(touch.identifier !== swipe.touchId) continue;
                    if(!inMenu) {
                        const dx = touch.clientX - swipe.startX;
                        const dy = touch.clientY - swipe.startY;
                        const dist = Math.hypot(dx, dy);
                        if(dist >= SWIPE_MIN_DIST) {
                            initMusic();
                            let dirX = 0, dirY = 0;
                            if(Math.abs(dx) > Math.abs(dy)) {
                                dirX = dx > 0 ? 1 : -1;
                            } else {
                                dirY = dy > 0 ? 1 : -1;
                            }
                            performDash(dirX, dirY);
                        }
                    }
                    swipe.active = false;
                    swipe.touchId = null;
                }
                e.preventDefault();
            };
            swipeZone.addEventListener('touchend', finishSwipe, {passive:false});
            swipeZone.addEventListener('touchcancel', () => {
                swipe.active = false;
                swipe.touchId = null;
            }, {passive:false});
        }

        // INPUTS
        window.addEventListener('keydown', (e) => {
            if(inMenu) return;
            let key = e.key;
            
            if(key === 'w') move.up = true;
            if(key === 's') move.down = true;
            if(key === 'a') move.left = true;
            if(key === 'd') move.right = true;
            
            let dashX = 0, dashY = 0;
            if(key === 'ArrowUp') dashY = -1;
            if(key === 'ArrowDown') dashY = 1;
            if(key === 'ArrowLeft') dashX = -1;
            if(key === 'ArrowRight') dashX = 1;
            if((dashX !== 0 || dashY !== 0)) {
                performDash(dashX, dashY);
                e.preventDefault();
            }
            if(key.startsWith('Arrow')) e.preventDefault();
            
            if(key === ' ' || key === 'Spacebar') {
                e.preventDefault();
                if(gameOver) {
                    resetGame();
                } else {
                    initMusic();
                }
            }
        });
        
        window.addEventListener('keyup', (e) => {
            if(e.key === 'w') move.up = false;
            if(e.key === 's') move.down = false;
            if(e.key === 'a') move.left = false;
            if(e.key === 'd') move.right = false;
        });
        
        canvas.addEventListener('click', () => {
            if(gameOver) {
                resetGame();
            } else {
                initMusic();
            }
        });
        
        canvas.addEventListener('click', () => {
            initMusic();
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
        });
        
        // LOOP (limitado a 60 FPS máximo en cualquier dispositivo, sin importar
        // la tasa de refresco de la pantalla — algunos celus/monitores van a 90-144Hz,
        // y como la física está atada a los frames, eso haría el juego más rápido de la cuenta)
        const TARGET_FPS = 60;
        const FRAME_DURATION = 1000 / TARGET_FPS;
        let lastFrameTime = 0;

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);

            if(!lastFrameTime) lastFrameTime = timestamp;
            const elapsed = timestamp - lastFrameTime;
            if(elapsed < FRAME_DURATION) return;
            lastFrameTime = timestamp - (elapsed % FRAME_DURATION);

            if(!inMenu) {
                update();
                draw();
            }
        }
        
        showGameScreen();
        resetGame();
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>
