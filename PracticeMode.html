<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BulletDasher - Practice Mode</title>
    <link rel="icon" type="image/svg+xml" href="player-icon-practice.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            transition: background-color 0.05s ease;
        }
        
        body.damage-flash {
            background-color: #ff0000 !important;
        }
        
        canvas {
            border: 2px solid white;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
            cursor: none;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: lime;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            font-size: 14px;
        }
        
        .controls-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            font-size: 12px;
            padding: 5px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }
        
        .restart-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: gray;
            background: rgba(0,0,0,0.5);
            font-size: 11px;
            padding: 5px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }

        .mobile-hidden { display: none !important; }

        #musicToggle {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 70;
            border: 1px solid white;
            cursor: pointer;
        }

        #musicToggle:hover {
            background: rgba(255,255,255,0.2);
        }

        #fullscreenBtn {
            position: absolute;
            top: 10px;
            right: 150px;
            color: white;
            background: rgba(0,0,0,0.7);
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 70;
            border: 1px solid white;
            cursor: pointer;
        }

        #fullscreenBtn:hover {
            background: rgba(255,255,255,0.2);
        }

        #fullscreenBtn.hidden { display: none !important; }

        .hidden {
            display: none !important;
        }

        .neon-btn {
            position: relative;
            background: rgba(255,0,0,0.08);
            color: #ff4444;
            border: 2px solid #ff0000;
            padding: 16px 55px;
            font-size: 22px;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 3px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,0,0,0.6), inset 0 0 10px rgba(255,0,0,0.25);
            text-shadow: 0 0 8px #ff0000;
            transition: all 0.2s ease;
        }

        .neon-btn:hover {
            background: rgba(255,0,0,0.22);
            box-shadow: 0 0 22px rgba(255,0,0,0.9), inset 0 0 15px rgba(255,0,0,0.4);
            transform: scale(1.05);
            color: #ffaaaa;
        }

        #menuBtn {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            padding: 10px 28px;
            font-size: 13px;
            color: #fff44d;
            border-color: #ffee00;
            background: rgba(255,238,0,0.08);
            box-shadow: 0 0 10px rgba(255,238,0,0.6), inset 0 0 10px rgba(255,238,0,0.25);
            text-shadow: 0 0 8px #ffee00;
        }

        #menuBtn:hover {
            transform: translateX(-50%) scale(1.05);
            background: rgba(255,238,0,0.22);
            box-shadow: 0 0 22px rgba(255,238,0,0.9), inset 0 0 15px rgba(255,238,0,0.4);
            color: #fff9b3;
        }

        /* ---------- CONTROLES MÓVILES ---------- */
        #mobileControls {
            position: fixed;
            inset: 0;
            z-index: 60;
            pointer-events: none;
        }

        #mobileControls.hidden { display: none !important; }

        #joystickZone {
            position: absolute;
            left: 20px;
            bottom: 20px;
            width: 130px;
            height: 130px;
            pointer-events: auto;
            touch-action: none;
        }

        #joystickBase {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            border: 2px solid rgba(0,255,255,0.55);
            box-shadow: 0 0 15px rgba(0,255,255,0.3), inset 0 0 15px rgba(0,255,255,0.15);
        }

        #joystickKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 54px;
            height: 54px;
            margin-left: -27px;
            margin-top: -27px;
            border-radius: 50%;
            background: rgba(0,255,255,0.55);
            box-shadow: 0 0 12px rgba(0,255,255,0.9);
        }

        #swipeZone {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
        }

        /* Zona central para pausar/despausar con un toque (reemplaza a la barra
           espaciadora, que no existe en celular). Va después de swipeZone en el
           DOM para quedar por encima suyo y "robarle" los toques justo en el centro. */
        #pauseZone {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 160px;
            height: 160px;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            touch-action: none;
        }

        /* ---------- PANEL DE PRÁCTICA ---------- */
        .practice-square {
            width: 84px;
            height: 84px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(0,255,255,0.5);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,255,255,0.35), inset 0 0 8px rgba(0,255,255,0.15);
            transition: box-shadow 0.15s ease, background 0.15s ease, transform 0.15s ease;
            font-family: monospace;
            padding: 4px;
        }

        .practice-square:hover, .practice-square:focus-visible {
            background: rgba(0,255,255,0.15);
            box-shadow: 0 0 20px rgba(0,255,255,0.9), inset 0 0 12px rgba(0,255,255,0.3);
            transform: scale(1.06);
        }

        .practice-square:active {
            transform: scale(0.97);
        }

        #spawnPanel {
            position: fixed;
            left: 22px;
            top: 42%;
            transform: translateY(-50%);
            z-index: 55;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .spawn-row {
            display: flex;
            flex-direction: row;
            gap: 6px;
        }

        #spawnBtn {
            width: 96px;
            height: 96px;
        }

        .spawn-side-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: space-between;
        }

        .spawn-side-controls .practice-square.small-square {
            width: 45px;
            height: 45px;
            font-size: 16px;
            background: #163c42;
        }

        .spawn-side-controls .practice-square.small-square:hover,
        .spawn-side-controls .practice-square.small-square:focus-visible {
            background: #1f5158;
        }

        /* ---------- PANEL DE CORRER LISTA (lado derecho, solo con level creator activo) ---------- */
        #runPanel {
            position: fixed;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 65;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #runListBtn {
            width: 70px;
            height: 96px;
            color: #7dff7d;
            border-color: #33ff33;
            box-shadow: 0 0 8px rgba(51,255,51,0.35), inset 0 0 8px rgba(51,255,51,0.15);
            text-shadow: 0 0 6px #33ff33;
            font-size: 26px;
        }
        #runListBtn:hover {
            background: rgba(51,255,51,0.15);
            box-shadow: 0 0 20px rgba(51,255,51,0.9), inset 0 0 12px rgba(51,255,51,0.3);
        }

        #spawnBtn .sprite-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #spawnBtn .sprite-name {
            margin-top: 4px;
            font-size: 10px;
            color: #aaffff;
            letter-spacing: 1px;
            text-shadow: 0 0 4px cyan;
            white-space: nowrap;
        }

        /* En celular, estos paneles solo se muestran en orientación horizontal */
        @media (orientation: portrait) and (pointer: coarse) {
            #spawnPanel, #runPanel {
                display: none !important;
            }
        }

        /* ---------- SWITCH DEL LEVEL CREATOR ---------- */
        .lc-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
            cursor: pointer;
        }

        .lc-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .lc-slider {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(0,255,255,0.5);
            border-radius: 24px;
            box-shadow: 0 0 8px rgba(0,255,255,0.35), inset 0 0 8px rgba(0,255,255,0.15);
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        .lc-slider::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            left: 2px;
            top: 2px;
            border-radius: 50%;
            background: rgba(0,255,255,0.55);
            box-shadow: 0 0 8px rgba(0,255,255,0.9);
            transition: transform 0.15s ease;
        }

        .lc-switch input:checked + .lc-slider {
            background: rgba(0,255,255,0.15);
            box-shadow: 0 0 16px rgba(0,255,255,0.8), inset 0 0 10px rgba(0,255,255,0.3);
        }

        .lc-switch input:checked + .lc-slider::before {
            transform: translateX(22px);
        }

        /* Variante verde: mismo switch, paleta a juego con runListBtn (▶) */
        .lc-switch-green .lc-slider {
            border-color: #33ff33;
            box-shadow: 0 0 8px rgba(51,255,51,0.35), inset 0 0 8px rgba(51,255,51,0.15);
        }

        .lc-switch-green .lc-slider::before {
            background: rgba(51,255,51,0.55);
            box-shadow: 0 0 8px rgba(51,255,51,0.9);
        }

        .lc-switch-green input:checked + .lc-slider {
            background: rgba(51,255,51,0.15);
            box-shadow: 0 0 16px rgba(51,255,51,0.8), inset 0 0 10px rgba(51,255,51,0.3);
        }

        /* ---------- CAJITA DEL LEVEL CREATOR ---------- */
        #levelCreatorBox {
            width: 148px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(0,255,255,0.5);
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,255,255,0.35), inset 0 0 8px rgba(0,255,255,0.15);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .lc-toolbar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .lc-tool-btn {
            background: #163c42;
            color: #aaffff;
            border: 1px solid rgba(0,255,255,0.5);
            border-radius: 5px;
            font-size: 14px;
            padding: 6px 0;
            cursor: pointer;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        .lc-tool-btn:hover {
            background: #1f5158;
            box-shadow: 0 0 10px rgba(0,255,255,0.6);
        }

        .lc-export-btn {
            width: 100%;
            background: #163c42;
            color: #aaffff;
            border: 1px solid rgba(0,255,255,0.5);
            border-radius: 5px;
            font-size: 14px;
            padding: 6px 0;
            cursor: pointer;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        .lc-export-btn:hover {
            background: #1f5158;
            box-shadow: 0 0 10px rgba(0,255,255,0.6);
        }

        .lc-guide-btn {
            width: 100%;
            display: block;
            box-sizing: border-box;
            background: #163c42;
            color: #fff9c4;
            border: 1px solid rgba(255,238,0,0.5);
            border-radius: 5px;
            font-size: 13px;
            font-family: monospace;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            padding: 6px 0;
            cursor: pointer;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        .lc-guide-btn:hover {
            background: #4a4212;
            box-shadow: 0 0 10px rgba(255,238,0,0.6);
        }

        .lc-toolbar-bottom {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
        }

        .lc-list {
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lc-block {
            background: #163338;
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 10px;
            color: #d8fff9;
            word-break: break-all;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .lc-block:hover {
            background: #1e454c;
        }

        .lc-param-input {
            width: 100%;
            background: #0d0d0d;
            color: #fff44d;
            border: 1px solid #ffee00;
            border-radius: 3px;
            font-family: monospace;
            font-size: 10px;
            padding: 2px 4px;
        }

        @keyframes lcFlashRed {
            0%, 100% { background: #163338; border-color: rgba(0,255,255,0.3); }
            50% { background: #661a1a; border-color: #ff0000; }
        }

        .lc-block.lc-flash {
            animation: lcFlashRed 0.4s ease;
        }

        /* ---------- VARA DE INSERCIÓN (dónde cae el próximo bloque) ---------- */
        .lc-cursor {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 1px 0;
        }

        .lc-cursor-line {
            flex: 1;
            height: 3px;
            background: #ff44ff;
            border-radius: 2px;
            box-shadow: 0 0 8px #ff44ff, 0 0 14px rgba(255,68,255,0.7);
            animation: lcCursorPulse 1.1s ease-in-out infinite;
        }

        @keyframes lcCursorPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .lc-cursor-arrow {
            background: #3a1c3a;
            color: #ff9dff;
            border: 1px solid #ff44ff;
            border-radius: 4px;
            font-size: 9px;
            line-height: 1;
            padding: 3px 4px;
            cursor: pointer;
            font-family: monospace;
        }

        .lc-cursor-arrow:hover:not(:disabled) {
            background: #55285a;
            box-shadow: 0 0 8px rgba(255,68,255,0.7);
        }

        .lc-cursor-arrow:disabled {
            opacity: 0.25;
            cursor: default;
        }
    </style>
<script src="cosmetics.js"></script>
<script src="achievements.js"></script>
</head>
<body>
<div id="ui" class="hidden">
    ❤️ VIDA: <span id="hp">3</span> | 🎯 SCORE: <span id="score">0</span><br>
    ⏱️ Tiempo: <span id="gameTime">0:00</span> | ☠️ Extinciones: <span id="extinctionCount">0</span>
</div>
<div class="controls-info hidden">
    🎮 WASD = mover | ⚡ FLECHAS = dash (atraviesa y mata enemigos, deja vida) | 📱 Joystick + desliza a la derecha para dash
</div>
<div class="restart-hint hidden">
    💀 GAME OVER → Presiona ESPACIO para reiniciar
</div>
<button id="musicToggle" class="hidden">🎵 Música: ON</button>
<button id="fullscreenBtn" class="hidden">⛶ Pantalla completa</button>
<button id="menuBtn" class="neon-btn hidden">🏠 Menú Principal</button>
<canvas id="gameCanvas" width="1100" height="750" class="hidden"></canvas>

<div id="spawnPanel" class="hidden">
    <div class="spawn-row">
        <button id="spawnBtn" class="practice-square" title="Invocar enemigo seleccionado">
            <span class="sprite-icon" id="spawnSpriteIcon"></span>
            <span class="sprite-name" id="spawnSpriteName">PURP</span>
        </button>
        <div class="spawn-side-controls">
            <button id="selectUpBtn" class="practice-square small-square" title="Enemigo anterior">▲</button>
            <button id="selectDownBtn" class="practice-square small-square" title="Siguiente enemigo">▼</button>
        </div>
    </div>
    <label class="lc-switch" title="Activar creador de niveles">
        <input type="checkbox" id="levelCreatorActivate">
        <span class="lc-slider"></span>
    </label>
    <div id="levelCreatorBox" class="hidden">
        <div class="lc-toolbar">
            <button id="lcClearBtn" class="lc-tool-btn" title="Borrar toda la lista">🗑️</button>
            <button id="lcWaitBtn" class="lc-tool-btn" title="Añadir espera de 1 segundo">⏰</button>
            <button id="lcUndoBtn" class="lc-tool-btn" title="Quitar último bloque">❌</button>
            <button id="lcLoadBtn" class="lc-tool-btn" title="Cargar archivo .bldh">📋</button>
        </div>
        <button id="lcExportBtn" class="lc-export-btn" title="Descargar lista como .bldh">📎</button>
        <input type="file" id="lcFileInput" accept=".bldh,.txt" class="hidden">
        <div id="lcList" class="lc-list"></div>
        <div class="lc-toolbar-bottom">
            <button id="lcRepeatBtn" class="lc-tool-btn" title="Añadir bloque Repetir">🔁</button>
            <button id="lcComplexBtn" class="lc-tool-btn" title="Añadir bloque Complejo (reservado para el futuro)">🔥</button>
        </div>
        <a id="lcGuideBtn" class="lc-guide-btn" href="guia_bldh.pdf" target="_blank" rel="noopener" title="Abrir la guía del lenguaje .bldh">📖 Guía</a>
    </div>
</div>

<div id="runPanel" class="hidden">
    <button id="runListBtn" class="practice-square" title="Correr lista">▶</button>
    <label class="lc-switch lc-switch-green" title="Auto-correr el .bldh al revivir">
        <input type="checkbox" id="autoReplayOnReviveActivate">
        <span class="lc-slider"></span>
    </label>
</div>

<div id="mobileControls" class="hidden">
    <div id="joystickZone">
        <div id="joystickBase">
            <div id="joystickKnob"></div>
        </div>
    </div>
    <div id="swipeZone"></div>
    <div id="pauseZone"></div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bodyElement = document.body;

        // ---------- CONTROL DE PANTALLA DE JUEGO ----------
        const menuBtn = document.getElementById('menuBtn');
        const gameScreenElements = [
            document.getElementById('ui'),
            document.querySelector('.controls-info'),
            document.querySelector('.restart-hint'),
            document.getElementById('musicToggle'),
            document.getElementById('spawnPanel'),
            canvas
        ];

        // En ClassicMode.html el juego arranca directo, sin overlay de menú
        let inMenu = false;

        // ---------- DETECCIÓN DE MÓVIL Y CONTROLES TÁCTILES ----------
        const isMobile = (('ontouchstart' in window) || navigator.maxTouchPoints > 0)
            && window.matchMedia('(pointer: coarse)').matches;

        const mobileControls = document.getElementById('mobileControls');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        if(isMobile) {
            // En celu este texto estorba y no aplica (no hay teclado) - se oculta siempre
            document.querySelector('.controls-info').classList.add('mobile-hidden');
            document.querySelector('.restart-hint').classList.add('mobile-hidden');
        }

        // ---------- ESCALAR CANVAS EN CELU (sin estirar, centrado) ----------
        // En horizontal se reserva espacio a los lados para los paneles de práctica (~130px c/u)
        const PRACTICE_PANEL_RESERVED = 165;
        function resizeCanvasForMobile() {
            if(!isMobile) return;
            const isLandscape = window.matchMedia('(orientation: landscape)').matches;
            const reserved = isLandscape ? PRACTICE_PANEL_RESERVED * 2 : 0;
            const availW = window.innerWidth - reserved;
            const availH = window.innerHeight;
            const scale = Math.min(availW / canvas.width, availH / canvas.height);
            canvas.style.width = (canvas.width * scale) + 'px';
            canvas.style.height = (canvas.height * scale) + 'px';
        }

        if(isMobile) {
            fullscreenBtn.classList.remove('hidden');
            resizeCanvasForMobile();
            window.addEventListener('resize', resizeCanvasForMobile);
            window.addEventListener('orientationchange', resizeCanvasForMobile);
        }

        function toggleFullscreen() {
            const el = document.documentElement;
            if(!document.fullscreenElement && !document.webkitFullscreenElement) {
                if(el.requestFullscreen) el.requestFullscreen().catch(() => {});
                else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } else {
                if(document.exitFullscreen) document.exitFullscreen();
                else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        function updateFullscreenBtnUI() {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
            fullscreenBtn.textContent = isFs ? "✕ Salir pantalla completa" : "⛶ Pantalla completa";
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', () => { updateFullscreenBtnUI(); resizeCanvasForMobile(); });
        document.addEventListener('webkitfullscreenchange', () => { updateFullscreenBtnUI(); resizeCanvasForMobile(); });

        function showGameScreen() {
            inMenu = false;
            gameScreenElements.forEach(el => el.classList.remove('hidden'));
            if(isMobile) mobileControls.classList.remove('hidden');
        }

        function goToMainMenu() {
            stopMusic();
            window.location.href = 'index.html';
        }

        menuBtn.addEventListener('click', goToMainMenu);
        
        // ---------- AUDIO ----------
        let backgroundMusic = null;
        let musicInitialized = false;
        
        function initMusic() {
            if (musicInitialized) return;
            try {
                backgroundMusic = new Audio('musicapractice.mp3');
                backgroundMusic.loop = true;
                backgroundMusic.volume = 0.7;
                if (!musicMuted) {
                    backgroundMusic.play().catch(e => console.log("Esperando interacción para reproducir música"));
                }
                musicInitialized = true;
            } catch(e) { console.log("No se pudo cargar musicapractice.mp3", e); }
        }
        
        function restartMusic() {
            if (backgroundMusic) {
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
                if (!musicMuted) {

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.frequency.value = 220;
                gainNode.gain.value = 0.3;
                
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                oscillator.stop(audioCtx.currentTime + 0.3);
                
                if (audioCtx.state === 'suspended') {

            } catch(e) { console.log("Audio no soportado"); }

        // Corta el texto en líneas que no se salgan del ancho disponible, respetando palabras
        // enteras (nada de cortar una palabra a la mitad). ctx.font debe estar seteado antes
        // de llamar a esta función, porque usa measureText con la tipografía activa.
        function wrapCanvasText(text, maxWidth) {
            const words = text.split(' ');
            const lines = [];
            let current = '';
            for(const word of words) {
                const test = current ? current + ' ' + word : word;
                if(current && ctx.measureText(test).width > maxWidth) {
                    lines.push(current);
                    current = word;
                } else {
                    current = test;
                }
            }
            if(current) lines.push(current);
            return lines;
        }

        function drawCanvasTextOverlay() {
            if(!canvasTextOverlay) return;
            // El tamaño de letra se adapta al ancho del canvas, no es un valor fijo.
            const fontSize = Math.round(canvas.width * 0.065);
            ctx.save();
            ctx.font = `bold ${fontSize}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#00ffee';
            ctx.shadowColor = '#00ffee';
            ctx.shadowBlur = 14;
            const maxWidth = canvas.width * 0.85;
            const lines = wrapCanvasText(canvasTextOverlay.text, maxWidth);
            const lineHeight = fontSize * 1.15;
            const totalHeight = lines.length * lineHeight;
            let y = canvas.height/2 - totalHeight/2 + lineHeight/2;
            for(const line of lines) {
                ctx.fillText(line, canvas.width/2, y);
                y += lineHeight;
            }
            ctx.restore();
        }

        let autoReplayOnRevive = false;
        autoReplayOnReviveEl.addEventListener('change', () => {
            autoReplayOnRevive = autoReplayOnReviveEl.checked;
        });

        // Spawns "parametrizados": si hay parámetros válidos, nacen exactamente donde se pide;
        // si no, se usa el spawn clásico (random) que ya existía en el modo práctica.
        function spawnPurpAt(x, y) {
            slowEnemies.push({
                x: x, y: y, size: 14,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                maxSpeed: 2.0
            });
        }

        function spawnRedstAt(x, y) {
            bulletEnemies.push({
                x: x, y: y, size: 10,
                state: 'aiming',
                aimTimer: 35,
                targetX: player.x, targetY: player.y,
                vx: 0, vy: 0
            });
        }

        // Ángulo en grados convencionales (0 = derecha, 90 = abajo), medido desde el punto (x,y)
        // hacia ambos lados hasta cubrir todo el canvas.
        function spawnLaserAt(x, y, anguloDeg, aparicionSec, duracionSec) {
            const rad = anguloDeg * Math.PI / 180;
            const halfLen = 1200;
            const x1 = x - Math.cos(rad) * halfLen;
            const y1 = y - Math.sin(rad) * halfLen;
            const x2 = x + Math.cos(rad) * halfLen;
            const y2 = y + Math.sin(rad) * halfLen;
            lasers.push({
                x1, y1, x2, y2,
                charge: Math.max(1, Math.round(aparicionSec * FRAMES_PER_SECOND)),
                lifetime: Math.max(1, Math.round(duracionSec * FRAMES_PER_SECOND)),
                pattern: 0
            });
        }

        function spawnLamovAt(lado, vel) {
            const fromLeft = lado === 0;
            movingLasers.push({
                x: fromLeft ? 0 : canvas.width,
                fromLeft: fromLeft,
                charge: MOVING_LASER_WARMUP,
                speed: vel,
                colorIdx: Math.floor(Math.random() * 3)
            });
        }

        function triggerExtcnAt(x, y, tiempoSec) {
            shadowEvent.active = false;
            shadowEvent.phase = 0;
            extinctionEvent.active = false;
            extinctionEvent.phase = 0;
            shadowEvent.active = true;
            shadowEvent.phase = 1;
            shadowEvent.timer = Math.max(1, Math.round(tiempoSec * FRAMES_PER_SECOND));
            shadowEvent.safeZone = {
                x: x, y: y, radius: 90,
                vx: (Math.random() - 0.5) * 1.2,
                vy: (Math.random() - 0.5) * 1.2
            };
        }

        function triggerBanexAt(x, dir) {
            extinctionEvent.active = false;
            extinctionEvent.phase = 0;
            shadowEvent.active = false;
            shadowEvent.phase = 0;
            extinctionEvent.active = true;
            extinctionEvent.phase = 1;
            extinctionEvent.timer = 240;
            const half = extinctionEvent.bandWidth / 2;
            extinctionEvent.x = clamp(x, half, canvas.width - half);
            extinctionEvent.vx = (dir === 0 ? -1 : 1) * EXTINCTION_SPEED;
        }

        function spawnPepesAt(x, y, tiempoSec) {
            const angle = Math.random() * Math.PI * 2;
            bouncers.push({
                x: x, y: y, size: BOUNCER_SIZE,
                vx: Math.cos(angle) * BOUNCER_SPEED,
                vy: Math.sin(angle) * BOUNCER_SPEED,
                life: Math.max(1, Math.round(tiempoSec * FRAMES_PER_SECOND)),
                leaving: false
            });
        }

        function spawnRockAt(x, y, tier) {
            const moveAngle = Math.random() * Math.PI * 2;
            const speed = randRange(ROCK_SPEED_MIN, ROCK_SPEED_MAX);
            const vx = Math.cos(moveAngle) * speed;
            const vy = Math.sin(moveAngle) * speed;
            asteroids.push(createAsteroid(x, y, clamp(Math.round(tier), 1, 3), vx, vy));
        }

        function spawnBrskrAt(x, y, vidas) {
            const particleCount = randInt(BERSERKER_SPAWN_PARTICLES_MIN, BERSERKER_SPAWN_PARTICLES_MAX);
            const spawnParticles = [];
            for(let i=0; i<particleCount; i++) {
                spawnParticles.push({
                    angle: Math.random() * Math.PI * 2,
                    dist: BERSERKER_SPAWN_RADIUS * (0.55 + Math.random() * 0.55)
                });
            }
            berserkers.push({
                x, y, size: BERSERKER_SIZE,
                vx: 0, vy: 0,
                hp: Math.max(1, Math.round(vidas)),
                rotation: Math.random() * Math.PI * 2,
                blinkTimer: 0,
                spawnTimer: BERSERKER_MATERIALIZE_DURATION,
                spawnParticles
            });
        }

        // Nombres de parámetros por enemigo (en orden), función parametrizada y función random (fallback).
        // paramLabels (opcional): para parámetros con opciones fijas (no números libres), texto a
        // mostrar en el placeholder en vez del nombre — mismo orden que "params".
        const ENEMY_PARAM_SPECS = {
            purp:  { params: ['x','y'],                                run: spawnPurpAt,    fallback: () => { if(!gameOver) spawnSinglePurp(); } },
            redst: { params: ['x','y'],                                run: spawnRedstAt,   fallback: () => { if(!gameOver) spawnSingleRedst(); } },
            laser: { params: ['x','y','angulo','aparicion','duracion'],run: spawnLaserAt,   fallback: () => { if(!gameOver) spawnLaser(); } },
            extcn: { params: ['x','y','tiempo'],                       run: triggerExtcnAt, fallback: () => { if(!gameOver) triggerSingleExtcn(); } },
            lamov: { params: ['lado','vel'],                           run: spawnLamovAt,   fallback: () => { if(!gameOver) spawnMovingLaser(); },
                     paramLabels: ['0=izq/1=der','vel'] },
            banex: { params: ['x','dir'],                              run: triggerBanexAt, fallback: () => { if(!gameOver) triggerSingleBanex(); },
                     paramLabels: ['x','0=izq/1=der'] },
            pepes: { params: ['x','y','tiempo'],                       run: spawnPepesAt,   fallback: () => { if(!gameOver) spawnSingleBouncer(); } },
            rock:  { params: ['x','y','tier'],                         run: spawnRockAt,    fallback: () => { if(!gameOver) spawnSingleRock(); },
                     paramLabels: ['x','y','tier(1-3)'] },
            brskr: { params: ['x','y','vidas'],                        run: spawnBrskrAt,   fallback: () => { if(!gameOver) spawnSingleBerserker(); } }
        };


        // El usuario escribe x,y con el centro del canvas como (0,0) — más intuitivo
        // que el (0,0) interno de <canvas>, que está en la esquina superior izquierda.
        // El eje Y se mantiene igual que el del canvas: valores positivos bajan, negativos suben.
        function centeredToCanvasCoords(paramName, value) {
            if(paramName === 'x') return value + canvas.width / 2;
            if(paramName === 'y') return canvas.height / 2 - value; // Y invertido: positivo = arriba
            return value;
        }

        function executeInvokeBlock(block) {
            const spec = ENEMY_PARAM_SPECS[block.enemyId];
            if(!spec) return;
            const raw = (block.params || '').trim();
            if(raw === '') { spec.fallback(); return; }
            const values = raw.split(',').map(v => parseFloat(v.trim()));
            if(values.length !== spec.params.length || values.some(v => isNaN(v))) {
                spec.fallback();
                return;
            }
            const canvasValues = values.map((v, i) => centeredToCanvasCoords(spec.params[i], v));
            spec.run(...canvasValues);
        }

        // ---------- Edición de la lista ----------
        function blockToDisplayText(block) {
            if(block.type === 'wait') return `esperar(${block.seconds})segundos`;
            if(block.type === 'invoke') return `invocar(${block.enemyId}(${block.params || ''}))`;
            if(block.type === 'repeat') {
                const parts = (block.params || '').split(',');
                const veces = (parts[0] || '').trim();
                const dir = (parts[1] || '').trim();
                const bloques = (parts[2] || '').trim();
                return `Repetir(${veces})veces(${dir})bloques(${bloques})`;
            }
            if(block.type === 'complex') return `Complejo.${block.params || ''}`;
            return '';
        }

        function isEditableBlock(block) {
            return block.type === 'invoke' || block.type === 'repeat' || block.type === 'complex';
        }

        function blockParamPlaceholder(block) {
            if(block.type === 'invoke') {
                const spec = ENEMY_PARAM_SPECS[block.enemyId];
                return spec ? (spec.paramLabels || spec.params).join(',') : '';
            }
            if(block.type === 'repeat') return 'veces,1=arriba/2=abajo,bloques';
            if(block.type === 'complex') return 'Confeti | Texto("txt")por(seg) | MusicHTMLFunc(archivo.mp3) | Si(vacio|vidas>#|vidas=#|vidas<#)Entonces(N)Sino(M) | Repetirinfveces(1/2)bloques(N)';
            return '';
        }

        function renderLevelCreatorList() {
            if(insertCursor > levelCreatorList.length) insertCursor = levelCreatorList.length;
            if(insertCursor < 0) insertCursor = 0;
            lcList.innerHTML = '';
            for(let idx = 0; idx <= levelCreatorList.length; idx++) {
                if(idx === insertCursor) lcList.appendChild(buildCursorBar());
                if(idx < levelCreatorList.length) {
                    const block = levelCreatorList[idx];
                    const div = document.createElement('div');
                    div.className = 'lc-block';
                    div.dataset.idx = idx;
                    div.textContent = blockToDisplayText(block);
                    if(isEditableBlock(block)) {
                        div.title = 'Click para editar parámetros';
                        div.addEventListener('click', () => editParamBlock(idx));
                    }
                    lcList.appendChild(div);
                }
            }
            const cursorEl = lcList.querySelector('.lc-cursor');
            if(cursorEl) cursorEl.scrollIntoView({ block: 'nearest' });
        }

        // La vara: línea brillante que marca dónde cae el próximo bloque. Sus dos flechitas
        // la mueven un lugar hacia arriba/abajo entre bloques (o hasta los extremos).
        function buildCursorBar() {
            const bar = document.createElement('div');
            bar.className = 'lc-cursor';
            const up = document.createElement('button');
            up.className = 'lc-cursor-arrow';
            up.textContent = '▲';
            up.title = 'Subir la vara';
            up.disabled = insertCursor <= 0;
            up.addEventListener('click', (e) => { e.stopPropagation(); moveCursor(-1); });
            const line = document.createElement('div');
            line.className = 'lc-cursor-line';
            const down = document.createElement('button');
            down.className = 'lc-cursor-arrow';
            down.textContent = '▼';
            down.title = 'Bajar la vara';
            down.disabled = insertCursor >= levelCreatorList.length;
            down.addEventListener('click', (e) => { e.stopPropagation(); moveCursor(1); });
            bar.appendChild(up);
            bar.appendChild(line);
            bar.appendChild(down);
            return bar;
        }

        function moveCursor(delta) {
            insertCursor = Math.max(0, Math.min(levelCreatorList.length, insertCursor + delta));
            renderLevelCreatorList();
        }

        function editParamBlock(idx) {
            const block = levelCreatorList[idx];
            if(!block || !isEditableBlock(block)) return;
            const div = lcList.querySelector(`.lc-block[data-idx="${idx}"]`);
            if(!div) return;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'lc-param-input';
            input.value = block.params || '';
            input.placeholder = blockParamPlaceholder(block);
            div.textContent = '';
            div.appendChild(input);
            input.focus();
            const commit = () => {
                block.params = input.value.trim();
                renderLevelCreatorList();
            };
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', (e) => {
                e.stopPropagation();
                if(e.key === 'Enter') { e.preventDefault(); input.blur(); }
            });
            input.addEventListener('keyup', (e) => e.stopPropagation());
            input.addEventListener('click', (e) => e.stopPropagation());
        }

        // Todo alta de bloque entra justo en la posición de la vara y la empuja un lugar hacia
        // abajo, para que quede debajo de lo que se acaba de poner (arriba de lo que ya seguía).
        function addInvokeBlock(enemyId) {
            levelCreatorList.splice(insertCursor, 0, { type: 'invoke', enemyId: enemyId, params: '' });
            insertCursor++;
            renderLevelCreatorList();
        }

        function addRepeatBlock() {
            levelCreatorList.splice(insertCursor, 0, { type: 'repeat', params: '' });
            insertCursor++;
            renderLevelCreatorList();
        }

        function addComplexBlock() {
            levelCreatorList.splice(insertCursor, 0, { type: 'complex', params: '' });
            insertCursor++;
            renderLevelCreatorList();
        }

        function addOrIncrementWaitBlock() {
            const prev = levelCreatorList[insertCursor - 1];
            if(prev && prev.type === 'wait') {
                prev.seconds++;
            } else {
                levelCreatorList.splice(insertCursor, 0, { type: 'wait', seconds: 1 });
                insertCursor++;
            }
            renderLevelCreatorList();
        }

        function flashBlockRedAt(idx) {
            const el = lcList.querySelector(`.lc-block[data-idx="${idx}"]`);
            if(!el) return;
            el.classList.remove('lc-flash');
            void el.offsetWidth; // reinicia la animación si se repite el click
            el.classList.add('lc-flash');
        }

        // ❌ ahora opera sobre el bloque que está JUSTO ARRIBA de la vara (el "último puesto"
        // desde el punto de vista de la vara, sea o no el último del array), y la vara baja
        // un lugar junto con el borrado para seguir pegada al mismo punto.
        function undoLastBlock() {
            if(insertCursor === 0) return; // no hay nada arriba de la vara
            const idx = insertCursor - 1;
            const target = levelCreatorList[idx];
            if(target.type === 'wait') {
                target.seconds--;
                if(target.seconds <= 0) {
                    levelCreatorList.splice(idx, 1);
                    insertCursor--;
                }
                renderLevelCreatorList();
            } else if(isEditableBlock(target)) {
                if(!target.params || target.params.trim() === '') {
                    levelCreatorList.splice(idx, 1);
                    insertCursor--;
                    renderLevelCreatorList();
                } else {
                    // Tiene parámetros definidos: hay que vaciarlos antes de poder borrar el bloque
                    flashBlockRedAt(idx);
                }
            }
        }

        function clearLevelCreatorList() {
            levelCreatorList = [];
            insertCursor = 0;
            levelLoadedFromFile = false;
            renderLevelCreatorList();
        }

        document.getElementById('lcClearBtn').addEventListener('click', clearLevelCreatorList);
        document.getElementById('lcWaitBtn').addEventListener('click', addOrIncrementWaitBlock);
        document.getElementById('lcUndoBtn').addEventListener('click', undoLastBlock);
        document.getElementById('lcLoadBtn').addEventListener('click', () => lcFileInput.click());
        document.getElementById('lcRepeatBtn').addEventListener('click', addRepeatBlock);
        document.getElementById('lcComplexBtn').addEventListener('click', addComplexBlock);

        lcFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                loadBldhText(String(ev.target.result || ''));
                // logro "Dashing Engineer": se cargó un archivo real con al menos un bloque válido
                levelLoadedFromFile = levelCreatorList.length > 0;
            };
            reader.readAsText(file);
            lcFileInput.value = '';
        });

        document.getElementById('lcExportBtn').addEventListener('click', exportBldh);

        // ---------- Serialización .bldh ----------
        function serializeBldh() {
            const parts = ['INICIO'];
            for(const block of levelCreatorList) parts.push(blockToDisplayText(block));
            parts.push('FIN');
            return parts.join('&');
        }

        function exportBldh() {
            const text = serializeBldh();
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'nivel.bldh';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function loadBldhText(text) {
            const parts = text.split('&').map(p => p.trim()).filter(p => p.length > 0);
            const newList = [];
            for(const part of parts) {
                if(part === 'INICIO' || part === 'FIN') continue;
                let m = part.match(/^invocar\(([a-zA-Z]+)\((.*)\)\)$/);
                if(m) {
                    const enemyId = m[1].toLowerCase();
                    if(ENEMY_PARAM_SPECS[enemyId]) {
                        newList.push({ type: 'invoke', enemyId: enemyId, params: m[2].trim() });
                    }
                    continue;
                }
                m = part.match(/^esperar\((\d+)\)segundos$/);
                if(m) {
                    newList.push({ type: 'wait', seconds: parseInt(m[1], 10) });
                    continue;
                }
                m = part.match(/^Repetir\((.*)\)veces\((.*)\)bloques\((.*)\)$/);
                if(m) {
                    newList.push({ type: 'repeat', params: `${m[1].trim()},${m[2].trim()},${m[3].trim()}` });
                    continue;
                }
                m = part.match(/^Complejo\.(.*)$/);
                if(m) {
                    newList.push({ type: 'complex', params: m[1] });
                }
            }
            levelCreatorList = newList;
            insertCursor = newList.length;
            renderLevelCreatorList();
        }

        // ================== INTÉRPRETE (correr la lista) ==================
        // Antes esto era un "compilador": flattenLevelList desenrollaba TODA la lista a un
        // array plano de instrucciones antes de arrancar (una macro-expansión, tipo #define).
        // Eso hacía imposible un loop infinito real: para "desenrollarlo" habría que generar
        // un array infinito ANTES de jugar, lo cual cuelga la pestaña sin llegar a ejecutar
        // nada. Ahora es un intérprete de verdad: un program counter (pc) que recorre
        // directamente levelCreatorList y puede saltar hacia atrás (goto), como el fetch-
        // decode-execute de una CPU. Un Repetir/Complejo infinito simplemente nunca deja de
        // saltar — no cuesta memoria ni tiempo de arranque, vive mientras el jugador juegue.
        //
        // "Repetir(veces)veces(dir)bloques(cantidad)" y "Complejo.Repetirinfveces(dir)bloques(N)"
        // (repetición infinita) NO son loops con apertura/cierre: apuntan hacia arriba (dir=1)
        // o hacia abajo (dir=2) de sí mismos en la lista, contando los "bloques" bloques más
        // cercanos en esa dirección — CUALQUIER tipo de bloque cuenta ahora (antes solo se
        // contaban invocar/esperar), precisamente para que un Repetir pueda apuntar a otro
        // Repetir/Complejo y armar loops anidados sin restricciones artificiales.
        // - dir=1 (arriba): el segmento ya corrió 1 vez de forma natural al llegar hasta acá,
        //   así que se repite (veces-1) veces más (Infinity si veces=∞), para sumar "veces"
        //   pasadas en total.
        // - dir=2 (abajo): el segmento todavía no corrió, así que se ejecuta "veces" veces
        //   completas ahora mismo, y al terminar el pc salta más allá del segmento para que la
        //   lista no lo vuelva a correr "solo" cuando el flujo natural llegue a esa posición.
        let listRunner = { active: false, pc: 0, waitFrames: 0, loopStack: [], ifStack: [] };
        const LEVEL_RUNNER_MAX_STEPS_PER_FRAME = 10000; // salvavidas: solo protege contra bugs (segmentos mal formados), no contra loops infinitos válidos

        // Interpreta los params de un bloque 'repeat' o de un 'complex' que sea
        // "Repetirinfveces(dir)bloques(N)" (repetición infinita). Devuelve
        // {veces, dir, bloques} (veces puede ser Infinity) o null si no aplica / es inválido.
        function getRepeatSpec(block) {
            if(block.type === 'repeat') {
                const parts = (block.params || '').split(',').map(v => parseFloat(v.trim()));
                const veces = Math.round(parts[0]);
                const dir = Math.round(parts[1]);
                const bloques = Math.round(parts[2]);
                const valid = parts.length === 3 && Number.isFinite(veces) && veces >= 1
                    && (dir === 1 || dir === 2) && Number.isFinite(bloques) && bloques >= 1;
                return valid ? { veces, dir, bloques } : null;
            }
            if(block.type === 'complex') {
                const m = (block.params || '').match(/^Repetirinfveces\((\d)\)bloques\((\d+)\)$/);
                if(!m) return null;
                const dir = parseInt(m[1], 10);
                const bloques = parseInt(m[2], 10);
                if((dir === 1 || dir === 2) && bloques >= 1) return { veces: Infinity, dir, bloques };
                return null;
            }
            return null;
        }

        // Dado el índice recién ejecutado, decide a dónde saltar: si es el final del segmento
        // de un loop activo, hay que volver al bloque Repetir/Complejo que lo generó (en vez de
        // seguir a la instrucción siguiente en línea recta). Si es el final del segmento
        // Entonces de un Complejo.Si activo, hay que saltarse el Sino entero (si lo hay).
        function nextPcAfter(executedIndex) {
            const ifTop = listRunner.ifStack[listRunner.ifStack.length - 1];
            if(ifTop && ifTop.segEnd === executedIndex) {
                listRunner.ifStack.pop();
                return ifTop.skipTo;
            }
            const top = listRunner.loopStack[listRunner.loopStack.length - 1];
            if(top && top.segEnd === executedIndex) return top.blockIndex;
            return executedIndex + 1;
        }

        // Interpreta los params de un "Complejo.Si(condicion)Entonces(N)Sino(M)". El N de
        // Entonces es obligatorio (>=1); el M de Sino puede venir vacío o en 0, lo que
        // significa "no hay rama Sino". Devuelve {cond, entoncesN, sinoM} o null si no matchea
        // o el Entonces está vacío/inválido.
        function getSiSpec(block) {
            if(block.type !== 'complex') return null;
            const m = (block.params || '').match(/^Si\((.*?)\)Entonces\((\d+)\)Sino\((\d*)\)$/);
            if(!m) return null;
            const entoncesN = parseInt(m[2], 10);
            if(!Number.isFinite(entoncesN) || entoncesN < 1) return null;
            let sinoM = m[3] === '' ? 0 : parseInt(m[3], 10);
            if(!Number.isFinite(sinoM) || sinoM < 0) sinoM = 0;
            return { cond: m[1], entoncesN, sinoM };
        }

        // Evalúa la condición dentro de un Complejo.Si. "vacio" (la palabra literal, no dejar
        // el campo en blanco) pregunta si hay enemigos vivos en pantalla — cuentan purps,
        // redsts, pepes, berserkers y asteroides de cualquier tier (no cuentan lasers/extcn/
        // banex, que son hazards de entorno, no enemigos). "vidas>#", "vidas=#" y "vidas<#"
        // comparan directamente contra las vidas (hp) actuales del jugador.
        function evaluateSiCondition(condStr) {
            const cond = (condStr || '').trim();
            if(cond === 'vacio') {
                return slowEnemies.length > 0 || bulletEnemies.length > 0 || bouncers.length > 0
                    || berserkers.length > 0 || asteroids.length > 0;
            }
            const m = cond.match(/^vidas(>|=|<)(\d+)$/);
            if(m) {
                const n = parseInt(m[2], 10);
                if(m[1] === '>') return hp > n;
                if(m[1] === '=') return hp === n;
                if(m[1] === '<') return hp < n;
            }
            return false; // condición desconocida/mal formada: se toma como falsa (rama Sino)
        }

        // Resuelve un Complejo.Si al llegar el pc a su posición i. Layout esperado en la lista:
        // [Si][...N bloques de Entonces...][...M bloques de Sino...][sigue de largo]
        // Si la condición es verdadera corre el Entonces y salta todo el Sino al terminar.
        // Si es falsa, salta el Entonces entero y corre el Sino (si existe); si no existe,
        // sigue de largo justo después del Entonces.
        function handleSiBlock(i, block) {
            const spec = getSiSpec(block);
            if(!spec) { listRunner.pc = i + 1; return; }

            const entoncesStart = i + 1;
            const entoncesEnd = Math.min(levelCreatorList.length - 1, i + spec.entoncesN);
            if(entoncesStart > entoncesEnd) { listRunner.pc = i + 1; return; } // no hay bloques que tomar: inválido

            const sinoStart = entoncesEnd + 1;
            const sinoEnd = Math.min(levelCreatorList.length - 1, entoncesEnd + spec.sinoM);
            const hasSino = spec.sinoM > 0 && sinoStart <= sinoEnd;
            const afterAll = hasSino ? sinoEnd + 1 : sinoStart;

            if(evaluateSiCondition(spec.cond)) {
                listRunner.ifStack.push({ segEnd: entoncesEnd, skipTo: afterAll });
                listRunner.pc = entoncesStart;
            } else if(hasSino) {
                listRunner.pc = sinoStart; // al terminar el Sino cae solo en afterAll, no hace falta marcarlo
            } else {
                listRunner.pc = afterAll;
            }
        }

        // Complejos que disparan un efecto puntual (no controlan flujo, como un invocar):
        // Confeti, Texto("...")por(seg) y MusicHTMLFunc(archivo.mp3). Devuelve true si el
        // texto del bloque matcheó alguno de estos y ya se ejecutó, false si no es ninguno.
        function executeComplexAction(block) {
            const params = block.params || '';
            if(params === 'Confeti') {
                triggerConfetti();
                return true;
            }
            let m = params.match(/^Texto\("([\s\S]*)"\)por\(([\d.]+)\)$/);
            if(m) {
                showCanvasText(m[1], parseFloat(m[2]));
                return true;
            }
            m = params.match(/^MusicHTMLFunc\(([^()]+)\)$/);
            if(m) {
                changeBackgroundMusic(m[1].trim());
                return true;
            }
            return false;
        }

        // Resuelve un bloque Repetir/Complejo-infinito al llegar el pc a su posición i.
        // Si la cima de la pila ya es ESTE bloque, es que estamos "volviendo" tras correr el
        // segmento de nuevo: decide si repetir otra vuelta o terminar. Si no, es la primera vez
        // que se entra en esta pasada concreta: arma el segmento y salta a su inicio.
        function handleRepeatOrComplex(i, block) {
            const spec = getRepeatSpec(block);
            if(!spec) { listRunner.pc = i + 1; return; } // inválido / vacío: no hace nada

            const top = listRunner.loopStack[listRunner.loopStack.length - 1];
            if(top && top.blockIndex === i) {
                if(top.remaining !== Infinity) top.remaining--;
                if(top.remaining === Infinity || top.remaining > 0) {
                    listRunner.pc = top.segStart;
                } else {
                    listRunner.loopStack.pop();
                    listRunner.pc = (spec.dir === 2) ? top.segEnd + 1 : i + 1;
                }
                return;
            }

            let segStart, segEnd, remaining;
            if(spec.dir === 1) {
                segEnd = i - 1;
                segStart = Math.max(0, i - spec.bloques);
                if(segEnd < segStart) { listRunner.pc = i + 1; return; } // no hay nada antes (ej: Repetir es el primer bloque)
                remaining = (spec.veces === Infinity) ? Infinity : spec.veces - 1;
                if(remaining === 0) { listRunner.pc = i + 1; return; } // veces=1: ya corrió su única pasada, nada que repetir
            } else {
                segStart = i + 1;
                segEnd = Math.min(levelCreatorList.length - 1, i + spec.bloques);
                if(segStart > segEnd) { listRunner.pc = i + 1; return; } // no hay nada después
                remaining = spec.veces; // ninguna pasada corrió todavía
            }

            // Dos rangos de loop solo pueden convivir en la pila si están bien anidados —
            // uno completamente adentro del otro, como paréntesis balanceados "( [ ] )" — o
            // completamente separados. Si se CRUZAN a medias, como "( [ ) ]" (ej: un Repetir
            // apunta a un rango que incluye a otro Repetir cuyo propio rango lo incluye de
            // vuelta a él), el chequeo de "¿es la cima de la pila?" nunca hace match y cada
            // uno empuja un frame nuevo sin parar: la pila crece sin límite (memory leak) en
            // vez de resolverse. Se detecta acá y se trata como bloque inválido (no-op) —
            // no tiene una semántica coherente de "cuál termina primero", igual que paréntesis
            // cruzados no se pueden resolver.
            for(const frame of listRunner.loopStack) {
                const overlap = segStart <= frame.segEnd && frame.segStart <= segEnd;
                if(!overlap) continue;
                const thisContainsFrame = segStart <= frame.segStart && frame.segEnd <= segEnd;
                const frameContainsThis = frame.segStart <= segStart && segEnd <= frame.segEnd;
                if(!thisContainsFrame && !frameContainsThis) {
                    listRunner.pc = i + 1; // rango cruzado con un loop activo: inválido, no hace nada
                    return;
                }
            }

            listRunner.loopStack.push({ blockIndex: i, segStart, segEnd, remaining });
            listRunner.pc = segStart;
        }

        function startListRun() {
            if(levelCreatorList.length === 0 || gameOver) return;
            if(levelLoadedFromFile) {
                Achievements.tryUnlock('dashing-engineer', Achievements.MODES.PRACTICE);
            }
            listRunner.active = true;
            listRunner.pc = 0;
            listRunner.waitFrames = 0;
            listRunner.loopStack = [];
            listRunner.ifStack = [];
        }

        // Se llama una vez por frame. Los bloques de control (repeat/complex) se resuelven
        // "gratis" en la misma pasada (no ejecutan nada por sí mismos, así que no consumen
        // tiempo de juego) hasta toparse con un invocar/esperar real, que sí consume el frame —
        // igual que el runner viejo hacía exactamente una acción por frame.
        function updateListRunner() {
            if(!listRunner.active) return;
            if(gameOver) { listRunner.active = false; return; }
            if(listRunner.waitFrames > 0) {
                listRunner.waitFrames--;
                return;
            }
            for(let steps = 0; steps < LEVEL_RUNNER_MAX_STEPS_PER_FRAME; steps++) {
                if(listRunner.pc < 0 || listRunner.pc >= levelCreatorList.length) {
                    listRunner.active = false; // la lista terminó: el juego sigue con normalidad
                    return;
                }
                const i = listRunner.pc;
                const block = levelCreatorList[i];
                if(block.type === 'invoke') {
                    executeInvokeBlock(block);
                    listRunner.pc = nextPcAfter(i);
                    return; // una invocación por frame
                } else if(block.type === 'wait') {
                    listRunner.waitFrames = Math.max(1, Math.round(block.seconds * FRAMES_PER_SECOND));
                    listRunner.pc = nextPcAfter(i);
                    return; // el conteo de la espera arranca este mismo frame
                } else if(block.type === 'repeat' || (block.type === 'complex' && getRepeatSpec(block))) {
                    handleRepeatOrComplex(i, block); // no consume frame: seguimos el for
                } else if(block.type === 'complex' && getSiSpec(block)) {
                    handleSiBlock(i, block); // salto condicional puro: tampoco consume frame
                } else if(block.type === 'complex' && executeComplexAction(block)) {
                    listRunner.pc = nextPcAfter(i);
                    return; // dispara el efecto (confeti/texto/música): consume un frame, igual que invocar
                } else {
                    listRunner.pc = i + 1; // 'complex' que no matchea nada conocido: no-op
                }
            }
            // Si se llega hasta acá, algo dejó de avanzar sin ejecutar nada en miles de pasos
            // (un bug real, ej. un segmento mal formado) — no es el caso de un loop infinito
            // válido, que siempre termina pasando por un invocar/esperar en cada vuelta.
            console.warn('Level runner: límite de pasos por frame alcanzado sin avanzar. Deteniendo para evitar colgar la pestaña.');
            listRunner.active = false;
        }

        // BANDA DE EXTINCIÓN (Banex — vertical, del Metro)
        function startExtinctionEvent() {
            if(extinctionEvent.active) return;
            extinctionEvent.active = true;
            extinctionEvent.phase = 1;
            extinctionEvent.timer = 240;
            extinctionEvent.x = Math.random() * (canvas.width - extinctionEvent.bandWidth) + extinctionEvent.bandWidth/2;
            extinctionEvent.vx = (Math.random() < 0.5 ? -1 : 1) * EXTINCTION_SPEED;

        // PRACTICE MODE: igual que arriba pero al revés — borra ambos eventos y arranca la banda
        function triggerSingleBanex() {
            extinctionEvent.active = false;
            extinctionEvent.phase = 0;
            shadowEvent.active = false;
            shadowEvent.phase = 0;
            startExtinctionEvent();
        }

        function updateExtinctionEvent() {
            if(!extinctionEvent.active) return;

            if(extinctionEvent.phase === 1) {
                extinctionEvent.x += extinctionEvent.vx;
                const half = extinctionEvent.bandWidth/2;
                if(extinctionEvent.x - half < 0) { extinctionEvent.x = half; extinctionEvent.vx = Math.abs(extinctionEvent.vx); }
                if(extinctionEvent.x + half > canvas.width) { extinctionEvent.x = canvas.width - half; extinctionEvent.vx = -Math.abs(extinctionEvent.vx); }

                extinctionEvent.timer--;
                if(extinctionEvent.timer <= 0) {
                    extinctionEvent.phase = 2;
                    const left = extinctionEvent.x - half;
                    const right = extinctionEvent.x + half;
                    if(player.x < left || player.x > right) {
                        damagePlayer();
                    } else {
                        addScore(100);
                    }
                    for(let i=0; i<slowEnemies.length; i++) {
                        let e = slowEnemies[i];
                        if(e.x < left || e.x > right) {
                            slowEnemies.splice(i,1);
                            i--;
                        }
                    }
                    for(let i=0; i<bulletEnemies.length; i++) {
                        let b = bulletEnemies[i];
                        if(b.x < left || b.x > right) {
                            bulletEnemies.splice(i,1);
                            i--;
                        }
                    }
                    extinctionEvent.active = false;
                    extinctionEvent.phase = 0;
                    extinctionCount++;
                    updateUI();
                }
            }
        }

        // REBOTONES (Pepes — del Metro): acá no hay puertas ni paradas, así que solo rebotan tipo
        // pong por el mapa hasta que se cumple su tiempo secreto interno (7 a 12s), momento en el
        // que salen calmados por el borde más cercano y desaparecen.
        function spawnSingleBouncer() {
            let side = Math.floor(Math.random() * 4);
            let x, y, vx, vy;
            if(side === 0) { x = Math.random() * canvas.width; y = -20; vx = (Math.random()-0.5)*BOUNCER_SPEED; vy = BOUNCER_SPEED; }
            else if(side === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; vx = -BOUNCER_SPEED; vy = (Math.random()-0.5)*BOUNCER_SPEED; }
            else if(side === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; vx = (Math.random()-0.5)*BOUNCER_SPEED; vy = -BOUNCER_SPEED; }
            else { x = -20; y = Math.random() * canvas.height; vx = BOUNCER_SPEED; vy = (Math.random()-0.5)*BOUNCER_SPEED; }

            let len = Math.hypot(vx, vy);
            vx = (vx/len) * BOUNCER_SPEED;
            vy = (vy/len) * BOUNCER_SPEED;

            bouncers.push({
                x: x, y: y, size: BOUNCER_SIZE,
                vx: vx, vy: vy,
                life: BOUNCER_LIFE_MIN + Math.floor(Math.random() * (BOUNCER_LIFE_MAX - BOUNCER_LIFE_MIN + 1)),
                leaving: false
            });
        }

        function updateBouncers() {
            for(let i=0; i<bouncers.length; i++) {
                let bo = bouncers[i];

                if(!bo.leaving) {
                    bo.life--;
                    if(bo.life <= 0) {
                        // Se cumplió su tiempo secreto: sale calmado por el borde más cercano
                        bo.leaving = true;
                        const distTop = bo.y, distBottom = canvas.height - bo.y;
                        const distLeft = bo.x, distRight = canvas.width - bo.x;
                        const minDist = Math.min(distTop, distBottom, distLeft, distRight);
                        if(minDist === distTop) { bo.vx = 0; bo.vy = -BOUNCER_LEAVE_SPEED; }
                        else if(minDist === distBottom) { bo.vx = 0; bo.vy = BOUNCER_LEAVE_SPEED; }
                        else if(minDist === distLeft) { bo.vx = -BOUNCER_LEAVE_SPEED; bo.vy = 0; }
                        else { bo.vx = BOUNCER_LEAVE_SPEED; bo.vy = 0; }
                    }
                }

                if(bo.leaving) {
                    bo.x += bo.vx;
                    bo.y += bo.vy;
                    if(bo.x < -bo.size || bo.x > canvas.width + bo.size || bo.y < -bo.size || bo.y > canvas.height + bo.size) {
                        bouncers.splice(i, 1);
                        i--;
                        continue;
                    }
                } else {
                    bo.x += bo.vx;
                    bo.y += bo.vy;
                    if(bo.x - bo.size/2 < 0) { bo.x = bo.size/2; bo.vx = Math.abs(bo.vx); }
                    if(bo.x + bo.size/2 > canvas.width) { bo.x = canvas.width - bo.size/2; bo.vx = -Math.abs(bo.vx); }
                    if(bo.y - bo.size/2 < 0) { bo.y = bo.size/2; bo.vy = Math.abs(bo.vy); }
                    if(bo.y + bo.size/2 > canvas.height) { bo.y = canvas.height - bo.size/2; bo.vy = -Math.abs(bo.vy); }
                }

                if(player.invincible === 0 && !gameOver && Math.hypot(player.x - bo.x, player.y - bo.y) < (player.size/2 + bo.size/2)) {
                    damagePlayer();
                }
            }
        }

        // ---------- ASTEROIDE (Rock, del Squasteroids) ----------
        function generateAsteroidPoints(radius) {
            const vertexCount = randInt(9, 14);
            const points = [];
            for(let i=0; i<vertexCount; i++) {
                const angle = (i / vertexCount) * Math.PI * 2;
                const r = radius * (0.72 + Math.random() * 0.34); // irregularidad tipo roca
                points.push({ angle, r });
            }
            return points;
        }

        function createAsteroid(x, y, tier, vx, vy) {
            let radius;
            if(tier === 1) radius = randRange(ASTEROID_TIER1_RADIUS_MIN, ASTEROID_TIER1_RADIUS_MAX);
            else if(tier === 2) radius = randRange(ASTEROID_TIER2_RADIUS_MIN, ASTEROID_TIER2_RADIUS_MAX);
            else radius = randRange(ASTEROID_TIER3_RADIUS_MIN, ASTEROID_TIER3_RADIUS_MAX);

            return {
                x: clamp(x, radius, canvas.width - radius),
                y: clamp(y, radius, canvas.height - radius),
                radius: radius,
                tier: tier,
                points: generateAsteroidPoints(radius),
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.01,
                vx: vx || 0, vy: vy || 0
            };
        }
