        // Genera los segmentos del borde del asteroide como escombros flotantes que se desvanecen
        function spawnAsteroidDebris(a) {
            const n = a.points.length;
            for(let i=0; i<n; i++) {
                const p1a = a.points[i];
                const p2a = a.points[(i+1) % n];
                const x1 = Math.cos(p1a.angle) * p1a.r;
                const y1 = Math.sin(p1a.angle) * p1a.r;
                const x2 = Math.cos(p2a.angle) * p2a.r;
                const y2 = Math.sin(p2a.angle) * p2a.r;
                const midAngle = Math.atan2((y1+y2)/2, (x1+x2)/2) + a.rotation;
                const speed = 0.7 + Math.random() * 1.3;
                asteroidDebris.push({
                    x: a.x, y: a.y,
                    p1x: x1, p1y: y1, p2x: x2, p2y: y2,
                    vx: Math.cos(midAngle) * speed, vy: Math.sin(midAngle) * speed,
                    rotation: a.rotation,
                    rotSpeed: (Math.random() - 0.5) * 0.09,
                    life: DEBRIS_LIFE, maxLife: DEBRIS_LIFE
                });
            }
        }

        // Rompe un asteroide en pedazos más chicos (tier 1 -> 2 -> 3 -> desintegrado).
        // Un ROJO rompe cualquier tier al atravesarlo (y sigue de largo, sin morir); el DASH
        // del jugador solo rompe tier 2 y 3 — el grande (tier 1) solo lo rompe un rojo,
        // igual que en Squasteroids. Solo cuando lo rompe el JUGADOR se suman 15 puntos.
        function breakAsteroid(index, byPlayer) {
            const a = asteroids[index];
            asteroids.splice(index, 1);

            if(a.tier === 1) {
                const pieces = randInt(3, 5);
                for(let i=0; i<pieces; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = a.radius * 0.3;
                    const speed = 0.4 + Math.random() * 0.5;
                    asteroids.push(createAsteroid(a.x + Math.cos(angle)*dist, a.y + Math.sin(angle)*dist, 2, Math.cos(angle)*speed, Math.sin(angle)*speed));
                }
            } else if(a.tier === 2) {
                const pieces = randInt(2, 4);
                for(let i=0; i<pieces; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = a.radius * 0.3;
                    const speed = 0.6 + Math.random() * 0.7;
                    asteroids.push(createAsteroid(a.x + Math.cos(angle)*dist, a.y + Math.sin(angle)*dist, 3, Math.cos(angle)*speed, Math.sin(angle)*speed));
                }
            } else {
                // tier 3: no deja pedazos nuevos, se desintegra en segmentos de borde que flotan y se desvanecen
                spawnAsteroidDebris(a);
            }

            if(byPlayer) addScore(15);
        }

        function updateAsteroidDebris() {
            for(let i=0; i<asteroidDebris.length; i++) {
                const d = asteroidDebris[i];
                d.x += d.vx;
                d.y += d.vy;
                d.rotation += d.rotSpeed;
                d.life--;
                if(d.life <= 0) {
                    asteroidDebris.splice(i, 1);
                    i--;
                }
            }
        }

        function updateAsteroids() {
            for(let i=0; i<asteroids.length; i++) {
                const a = asteroids[i];
                a.x += a.vx;
                a.y += a.vy;
                a.rotation += a.rotSpeed;

                // Acá no hay mundo toroidal como en Squasteroids: rebota contra los bordes del canvas
                if(a.x - a.radius < 0) { a.x = a.radius; a.vx = Math.abs(a.vx); }
                if(a.x + a.radius > canvas.width) { a.x = canvas.width - a.radius; a.vx = -Math.abs(a.vx); }
                if(a.y - a.radius < 0) { a.y = a.radius; a.vy = Math.abs(a.vy); }
                if(a.y + a.radius > canvas.height) { a.y = canvas.height - a.radius; a.vy = -Math.abs(a.vy); }

                if(player.invincible === 0 && !gameOver && Math.hypot(player.x - a.x, player.y - a.y) < (player.size/2 + a.radius*0.75)) {
                    damagePlayer();
                }
            }
        }

        // ---------- BERSERKER (Brskr, del Squasteroids) ----------
        function spawnSingleBerserker() {
            const angle = Math.random() * Math.PI * 2;
            const distance = randRange(BERSERKER_SPAWN_DIST_MIN, BERSERKER_SPAWN_DIST_MAX);
            let x = player.x + Math.cos(angle) * distance;
            let y = player.y + Math.sin(angle) * distance;
            x = clamp(x, BERSERKER_SIZE, canvas.width - BERSERKER_SIZE);
            y = clamp(y, BERSERKER_SIZE, canvas.height - BERSERKER_SIZE);

            const particleCount = randInt(BERSERKER_SPAWN_PARTICLES_MIN, BERSERKER_SPAWN_PARTICLES_MAX);
            const spawnParticles = [];
            for(let i=0; i<particleCount; i++) {
                spawnParticles.push({
                    angle: Math.random() * Math.PI * 2,
                    dist: BERSERKER_SPAWN_RADIUS * (0.55 + Math.random() * 0.55)
                });
            }

            berserkers.push({
                x, y, size: BERSERKER_SIZE,
                vx: 0, vy: 0,
                hp: BERSERKER_MAX_HP,
                rotation: Math.random() * Math.PI * 2,
                blinkTimer: 0,
                spawnTimer: BERSERKER_MATERIALIZE_DURATION,
                spawnParticles
            });
        }

        // Golpe del berserker contra el jugador: quita 2 de vida, lo empuja con fuerza en la
        // dirección en la que iba el berserker, y el berserker rebota con el choque.
        function berserkerHitPlayer(b) {
            if(player.invincible > 0 || gameOver) return;
            hp -= 2;
            Cosmetics.onPlayerHit(player.x, player.y); // skin-hit-rings: sueltan anillos si está equipada
            triggerDamageFlash();
            if(hp <= 0) {
                hp = 0;
                gameOver = true;
                updateUI();
                stopMusic();
                menuBtn.classList.remove('hidden');
            } else {
                updateUI();
                player.invincible = 20;
            }

            const speed = Math.hypot(b.vx, b.vy);
            if(speed > 0.01) {
                player.pushVx = (player.pushVx || 0) + (b.vx / speed) * BERSERKER_PLAYER_PUSH;
                player.pushVy = (player.pushVy || 0) + (b.vy / speed) * BERSERKER_PLAYER_PUSH;
            }

            b.vx *= -BERSERKER_BOUNCE_FACTOR;
            b.vy *= -BERSERKER_BOUNCE_FACTOR;
        }

        function updateBerserkers() {
            for(let i=0; i<berserkers.length; i++) {
                const b = berserkers[i];
                b.blinkTimer++;

                // Gira sobre su propio eje: mientras menos vidas tiene, más rápido gira
                const rotSpeed = 0.28 + (BERSERKER_MAX_HP - b.hp) * 0.14;
                b.rotation += rotSpeed;

                if(b.spawnTimer > 0) {
                    b.spawnTimer--; // sigue apareciendo: no se mueve ni colisiona todavía
                    continue;
                }

                // Acelera constantemente hacia el jugador (misil térmico)
                const dx = player.x - b.x;
                const dy = player.y - b.y;
                const dist = Math.hypot(dx, dy);
                if(dist > 0.01) {
                    const dirX = dx / dist;
                    const dirY = dy / dist;
                    b.vx += dirX * BERSERKER_ACCEL;
                    b.vy += dirY * BERSERKER_ACCEL;
                    const spd = Math.hypot(b.vx, b.vy);
                    if(spd > BERSERKER_MAX_SPEED) {
                        b.vx = (b.vx / spd) * BERSERKER_MAX_SPEED;
                        b.vy = (b.vy / spd) * BERSERKER_MAX_SPEED;
                    }
                }

                b.x += b.vx;
                b.y += b.vy;

                // Rebota contra los bordes del canvas (igual que el asteroide y los rebotones):
                // con tanta aceleración constante hacia el jugador, si se le permitiera salir
                // de pantalla terminaba orbitando varias vueltas antes de conectar el golpe.
                const half = b.size/2;
                if(b.x - half < 0) { b.x = half; b.vx = Math.abs(b.vx); }
                if(b.x + half > canvas.width) { b.x = canvas.width - half; b.vx = -Math.abs(b.vx); }
                if(b.y - half < 0) { b.y = half; b.vy = Math.abs(b.vy); }
                if(b.y + half > canvas.height) { b.y = canvas.height - half; b.vy = -Math.abs(b.vy); }

                // Rompe cualquier asteroide que toque a su paso, sin frenarse
                for(let j=0; j<asteroids.length; j++) {
                    const a = asteroids[j];
                    if(Math.hypot(b.x - a.x, b.y - a.y) < a.radius * 0.8) {
                        breakAsteroid(j, false);
                        break;
                    }
                }

                // Mata enemigos lentos a su paso
                for(let j=0; j<slowEnemies.length; j++) {
                    const e = slowEnemies[j];
                    if(Math.hypot(b.x - e.x, b.y - e.y) < (e.size/2 + b.size/2)) {
                        slowEnemies.splice(j, 1);
                        break;
                    }
                }

                // Choque con un rojo a toda velocidad: el rojo muere, el berserker pierde una vida
                for(let j=0; j<bulletEnemies.length; j++) {
                    const r = bulletEnemies[j];
                    if(r.state !== 'shooting') continue;
                    if(Math.hypot(b.x - r.x, b.y - r.y) < (b.size/2 + r.size/2)) {
                        bulletEnemies.splice(j, 1);
                        b.hp--;
                        playBerserkerHitSound();
                        b.vx *= BERSERKER_RED_BRAKE;
                        b.vy *= BERSERKER_RED_BRAKE;
                        break;
                    }
                }

                if(b.hp <= 0) {
                    berserkers.splice(i, 1);
                    i--;
                    continue;
                }

                // Choque con el jugador
                if(player.invincible === 0 && !gameOver && Math.hypot(player.x - b.x, player.y - b.y) < (player.size/2 + b.size/2)) {
                    berserkerHitPlayer(b);
                }
            }
        }
        
        function updateShadowEvent() {
            if(!shadowEvent.active) return;
            
            if(shadowEvent.phase === 1) {
                shadowEvent.safeZone.x += shadowEvent.safeZone.vx;
                shadowEvent.safeZone.y += shadowEvent.safeZone.vy;
                if(shadowEvent.safeZone.x - shadowEvent.safeZone.radius < 0) shadowEvent.safeZone.vx = Math.abs(shadowEvent.safeZone.vx);
                if(shadowEvent.safeZone.x + shadowEvent.safeZone.radius > canvas.width) shadowEvent.safeZone.vx = -Math.abs(shadowEvent.safeZone.vx);
                if(shadowEvent.safeZone.y - shadowEvent.safeZone.radius < 0) shadowEvent.safeZone.vy = Math.abs(shadowEvent.safeZone.vy);
                if(shadowEvent.safeZone.y + shadowEvent.safeZone.radius > canvas.height) shadowEvent.safeZone.vy = -Math.abs(shadowEvent.safeZone.vy);
                
                shadowEvent.timer--;
                if(shadowEvent.timer <= 0) {
                    shadowEvent.phase = 2;
                    let distToSafe = Math.hypot(player.x - shadowEvent.safeZone.x, player.y - shadowEvent.safeZone.y);
                    if(distToSafe > shadowEvent.safeZone.radius) {
                        damagePlayer();
                    } else {
                        addScore(100);
                    }
                    for(let i=0; i<slowEnemies.length; i++) {
                        let e = slowEnemies[i];
                        let dist = Math.hypot(e.x - shadowEvent.safeZone.x, e.y - shadowEvent.safeZone.y);
                        if(dist > shadowEvent.safeZone.radius) {
                            slowEnemies.splice(i,1);
                            i--;
                        }
                    }
                    for(let i=0; i<bulletEnemies.length; i++) {
                        let b = bulletEnemies[i];
                        let dist = Math.hypot(b.x - shadowEvent.safeZone.x, b.y - shadowEvent.safeZone.y);
                        if(dist > shadowEvent.safeZone.radius) {
                            bulletEnemies.splice(i,1);
                            i--;
                        }
                    }
                    shadowEvent.active = false;
                    shadowEvent.phase = 0;
                    extinctionCount++;
                    updateUI();
                }
            }
        }
        
        // Movimiento del jugador
        function updatePlayerMovement() {
            let speed = 4.8;
            let dx = 0, dy = 0;
            if(move.up) dy -= 1;
            if(move.down) dy += 1;
            if(move.left) dx -= 1;
            if(move.right) dx += 1;

            if(joystick.active && (joystick.dx !== 0 || joystick.dy !== 0)) {
                // Movimiento analógico del joystick táctil (respeta magnitud parcial)
                dx = joystick.dx;
                dy = joystick.dy;
                let len = Math.hypot(dx, dy);
                if(len > 1) { dx /= len; dy /= len; }
                player.x += dx * speed;
                player.y += dy * speed;
            } else if(dx !== 0 || dy !== 0) {
                let len = Math.hypot(dx, dy);
                dx /= len;
                dy /= len;
                player.x += dx * speed;
                player.y += dy * speed;
            }

            // Empujón recibido al ser golpeado por un berserker: se disipa solo con fricción,
            // se siente como un golpe real en vez de un salto brusco de posición.
            if(player.pushVx || player.pushVy) {
                player.x += player.pushVx;
                player.y += player.pushVy;
                player.pushVx *= BERSERKER_PUSH_FRICTION;
                player.pushVy *= BERSERKER_PUSH_FRICTION;
                if(Math.abs(player.pushVx) < 0.05) player.pushVx = 0;
                if(Math.abs(player.pushVy) < 0.05) player.pushVy = 0;
            }
            
            player.x = clamp(player.x, player.size/2, canvas.width - player.size/2);
            player.y = clamp(player.y, player.size/2, canvas.height - player.size/2);
        }
        
        // Función para verificar si un punto está cerca de un segmento (para el laser de dash)
        function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            const ax = px - x1;
            const ay = py - y1;
            const bx = x2 - x1;
            const by = y2 - y1;
            const dot = ax * bx + ay * by;
            const len2 = bx * bx + by * by;
            if (len2 === 0) return Math.hypot(px - x1, py - y1);
            let t = dot / len2;
            t = Math.max(0, Math.min(1, t));
            const closestX = x1 + t * bx;
            const closestY = y1 + t * by;
            return Math.hypot(px - closestX, py - closestY);
        }
        
        // DASH con laser y muerte de enemigos atravesados
        function performDash(dirX, dirY) {
            if(dashCooldown > 0 || gameOver || paused) return;
            if(dirX === 0 && dirY === 0) return;
            let len = Math.hypot(dirX, dirY);
            dirX /= len;
            dirY /= len;
            
            let dashDistance = DASH_SHORT;
            
            const startX = player.x;
            const startY = player.y;
            const endX = clamp(player.x + dirX * dashDistance, player.size/2, canvas.width - player.size/2);
            const endY = clamp(player.y + dirY * dashDistance, player.size/2, canvas.height - player.size/2);
            
            // ACTIVAR EL LASER DE DASH (destello)
            dashTrail.active = true;
            dashTrail.x1 = startX;
            dashTrail.y1 = startY;
            dashTrail.x2 = endX;
            dashTrail.y2 = endY;
            dashTrail.timer = DASH_TRAIL_DURATION;
            Cosmetics.triggerDashBorderGlow(PRACTICE_DASH_COLOR); // skin-border-glow: aura en los bordes si está equipada
            
            // MATAR ENEMIGOS QUE EL LASER ATRAVIESA
            // Enemigos lentos
            for(let i=0; i<slowEnemies.length; i++) {
                let e = slowEnemies[i];
                let distToLaser = pointToSegmentDistance(e.x, e.y, startX, startY, endX, endY);
                if(distToLaser < e.size/2 + 8) {
                    let enemyX = e.x, enemyY = e.y;
                    slowEnemies.splice(i,1);
                    killEnemy(null, true, enemyX, enemyY);
                    i--;
                }
            }
            
            // Enemigos rápidos (proyectiles)
            for(let i=0; i<bulletEnemies.length; i++) {
                let b = bulletEnemies[i];
                let distToLaser = pointToSegmentDistance(b.x, b.y, startX, startY, endX, endY);
                if(distToLaser < b.size/2 + 3) {
                    let enemyX = b.x, enemyY = b.y;
                    bulletEnemies.splice(i,1);
                    killEnemy(null, true, enemyX, enemyY);
                    i--;
                }
            }
            
            // Rebotones (Pepes): son inmortales, el dash no los mata — solo los asusta y cambian de
            // dirección (huyen en diagonal, contrario a donde está el jugador respecto a ellos).
            // Los que ya van saliendo por su tiempo cumplido no se ven afectados.
            for(let i=0; i<bouncers.length; i++) {
                let bo = bouncers[i];
                if(bo.leaving) continue;
                let distToLaser = pointToSegmentDistance(bo.x, bo.y, startX, startY, endX, endY);
                if(distToLaser < bo.size/2 + 8) {
                    let dx = bo.x - player.x;
                    let dy = bo.y - player.y;
                    let dist = Math.hypot(dx, dy);
                    if(dist > 0.01) {
                        bo.vx = (dx / dist) * BOUNCER_SPEED;
                        bo.vy = (dy / dist) * BOUNCER_SPEED;
                    }
                }
            }
            
            // Rompe pedazos de asteroide (tier 2 y 3) que el dash atraviesa; el grande
            // (tier 1) solo lo rompe un rojo, igual que en Squasteroids.
            for(let i=0; i<asteroids.length; i++) {
                const a = asteroids[i];
                if(a.tier === 1) continue;
                const distToLaser = pointToSegmentDistance(a.x, a.y, startX, startY, endX, endY);
                if(distToLaser < a.radius + 8) {
                    breakAsteroid(i, true);
                    i--;
                }
            }

            // Atraviesa berserkers: se frenan bastante y pierden una vida. Si esa vida era
            // la última, se destruyen y dejan cajita de vida verde.
            for(let i=0; i<berserkers.length; i++) {
                const b = berserkers[i];
                if(b.spawnTimer > 0) continue;
                const distToLaser = pointToSegmentDistance(b.x, b.y, startX, startY, endX, endY);
                if(distToLaser < b.size/2 + 8) {
                    b.vx = -dirX * BERSERKER_DASH_KNOCKBACK + b.vx * BERSERKER_DASH_BRAKE;
                    b.vy = -dirY * BERSERKER_DASH_KNOCKBACK + b.vy * BERSERKER_DASH_BRAKE;
                    b.hp--;
                    playBerserkerHitSound();
                    if(b.hp <= 0) {
                        const bx = b.x, by = b.y;
                        berserkers.splice(i, 1);
                        i--;
                        addScore(120);
                        spawnHealthItem(bx, by);
                    }
                }
            }
            
            // Mover al jugador
            player.x = endX;
            player.y = endY;
            
            dashCooldown = DASH_COOLDOWN_MAX;
            player.invincible = 8;
        }
        
        // Actualizar items de curación
        function updateHealthItems() {
            for(let i=0; i<healthItems.length; i++) {
                let item = healthItems[i];
                item.timer--;
                if(item.timer <= 0) {
                    healthItems.splice(i,1);
                    i--;
                    continue;
                }
                // Colisión con jugador
                let dist = Math.hypot(player.x - item.x, player.y - item.y);
                if(dist < player.size/2 + item.size/2) {
                    healPlayer();
                    healthItems.splice(i,1);
                    i--;
                }
            }
        }
        
        // Actualizar dash trail
        function updateDashTrail() {
            if(dashTrail.active) {
                dashTrail.timer--;
                if(dashTrail.timer <= 0) {
                    dashTrail.active = false;
                }
            }
        }
        
        
        // Enemigos lentos
        function updateSlowEnemies() {
            for(let i=0; i<slowEnemies.length; i++) {
                let e = slowEnemies[i];
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let dist = Math.hypot(dx, dy);
                if(dist > 0.01) {
                    let dirX = dx / dist;
                    let dirY = dy / dist;
                    e.vx += dirX * 0.1;
                    e.vy += dirY * 0.1;
                    let spd = Math.hypot(e.vx, e.vy);
                    if(spd > e.maxSpeed) {
                        e.vx = (e.vx / spd) * e.maxSpeed;
                        e.vy = (e.vy / spd) * e.maxSpeed;
                    }
                }
                e.x += e.vx;
                e.y += e.vy;
                
                if(e.x + e.size/2 < -50 || e.x - e.size/2 > canvas.width+50 || 
                   e.y + e.size/2 < -50 || e.y - e.size/2 > canvas.height+50) {
                    slowEnemies.splice(i,1);
                    i--;
                    continue;
                }
                
                if(player.invincible === 0 && !gameOver && Math.hypot(player.x - e.x, player.y - e.y) < (player.size/2 + e.size/2)) {
                    damagePlayer();
                }
            }
        }
        
        // Proyectiles rápidos
        function updateBulletEnemies() {
            for(let i=0; i<bulletEnemies.length; i++) {
                let b = bulletEnemies[i];
                if(b.state === 'aiming') {
                    b.aimTimer--;
                    b.targetX = player.x;
                    b.targetY = player.y;
                    if(b.aimTimer <= 0) {
                        b.state = 'shooting';
                        let dx = player.x - b.x;
                        let dy = player.y - b.y;
                        let dist = Math.hypot(dx, dy);
                        if(dist > 0.01) {
                            let spd = 16;
                            b.vx = (dx / dist) * spd;
                            b.vy = (dy / dist) * spd;
                        }
                    }
                } else {
                    b.x += b.vx;
                    b.y += b.vy;
                    if(b.x + 50 < 0 || b.x - 50 > canvas.width || b.y + 50 < 0 || b.y - 50 > canvas.height) {
                        bulletEnemies.splice(i,1);
                        i--;
                        continue;
                    }

                    // Rompe cualquier asteroide (grande, mediano o chico) al atravesarlo,
                    // pero sigue de largo (no se destruye), igual que en Squasteroids
                    for(let j=0; j<asteroids.length; j++) {
                        const a = asteroids[j];
                        if(Math.hypot(b.x - a.x, b.y - a.y) < a.radius * 0.8) {
                            breakAsteroid(j, false);
                            break;
                        }
                    }

                    if(player.invincible === 0 && !gameOver && Math.hypot(player.x - b.x, player.y - b.y) < (player.size/2 + b.size/2)) {
                        damagePlayer();
                        bulletEnemies.splice(i,1);
                        i--;
                    }
                }
            }
        }
        
        // Lasers
        function updateLasers() {
            for(let i=0; i<lasers.length; i++) {
                let l = lasers[i];
                if(l.charge > 0) {
                    l.charge--;
                } else {
                    l.lifetime--;
                    if(l.lifetime <= 0) {
                        lasers.splice(i,1);
                        i--;
                        continue;
                    }
                    let closest = closestPointOnSegment(player.x, player.y, l.x1, l.y1, l.x2, l.y2);
                    let dist = Math.hypot(player.x - closest.x, player.y - closest.y);
                    if(dist < player.size/2 + 5 && player.invincible === 0 && !gameOver) {
                        damagePlayer();
                    }
                }
            }
        }
        
        function closestPointOnSegment(px, py, x1, y1, x2, y2) {
            let ax = px - x1, ay = py - y1;
            let bx = x2 - x1, by = y2 - y1;
            let dot = ax * bx + ay * by;
            let len2 = bx * bx + by * by;
            if(len2 === 0) return {x: x1, y: y1};
            let t = dot / len2;
            t = Math.max(0, Math.min(1, t));
            return {x: x1 + t * bx, y: y1 + t * by};
        }

        function updateSpawners() {

        // ---------- DIBUJADO DE ASTEROIDES Y BERSERKER ----------
        function drawAsteroidDebris() {
            for(let d of asteroidDebris) {
                const alpha = d.life / d.maxLife;
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.rotation);
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.moveTo(d.p1x, d.p1y);
                ctx.lineTo(d.p2x, d.p2y);
                ctx.strokeStyle = "#c98dff";
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#a64dff";
                ctx.stroke();
                ctx.restore();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function drawAsteroids() {
            for(let a of asteroids) {
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.rotation);
                ctx.beginPath();
                for(let i=0; i<a.points.length; i++) {
                    const pt = a.points[i];
                    const px = Math.cos(pt.angle) * pt.r;
                    const py = Math.sin(pt.angle) * pt.r;
                    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fillStyle = "#241a33";
                ctx.strokeStyle = "#c98dff";
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#a64dff";
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
            ctx.shadowBlur = 0;
        }

        // Colores del berserker: cuerpo naranja-rojizo que se va poniendo más rojo y parpadea
        // más rápido mientras menos vidas le quedan.
        const BERSERKER_BASE_COLOR = { r: 255, g: 95, b: 40 };
        const BERSERKER_BLINK_COLOR = { r: 255, g: 15, b: 15 };

        function drawBerserkers() {
            for(let b of berserkers) {
                if(b.spawnTimer > 0) {
                    // Aparición gradual y épica: la zona se ilumina y partículas convergen al centro
                    const progress = 1 - (b.spawnTimer / BERSERKER_MATERIALIZE_DURATION);
                    const glowR = 55 + 45 * (1 - progress);
                    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, glowR);
                    grad.addColorStop(0, `rgba(255,100,40,${0.4 * progress})`);
                    grad.addColorStop(1, 'rgba(255,100,40,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, glowR, 0, Math.PI*2);
                    ctx.fill();

                    ctx.shadowBlur = 6;
                    ctx.shadowColor = "#ff5522";
                    for(let part of b.spawnParticles) {
                        const curDist = part.dist * (1 - progress);
                        const px = b.x + Math.cos(part.angle) * curDist;
                        const py = b.y + Math.sin(part.angle) * curDist;
                        ctx.beginPath();
                        ctx.fillStyle = `rgba(255,160,70,${0.25 + 0.65 * progress})`;
                        ctx.arc(px, py, 2 + 1.5 * progress, 0, Math.PI*2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                    continue;
                }

                // Parpadeo rojo: la frecuencia aumenta mientras menos vidas tiene
                const blinkSpeed = 0.05 + (BERSERKER_MAX_HP - b.hp) * 0.06;
                const blink = 0.5 + 0.5 * Math.sin(b.blinkTimer * blinkSpeed);
                const cr = Math.round(BERSERKER_BASE_COLOR.r + (BERSERKER_BLINK_COLOR.r - BERSERKER_BASE_COLOR.r) * blink);
                const cg = Math.round(BERSERKER_BASE_COLOR.g + (BERSERKER_BLINK_COLOR.g - BERSERKER_BASE_COLOR.g) * blink);
                const cb = Math.round(BERSERKER_BASE_COLOR.b + (BERSERKER_BLINK_COLOR.b - BERSERKER_BASE_COLOR.b) * blink);

                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.rotation);
                ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
                ctx.shadowBlur = 10 + 8 * blink;
                ctx.shadowColor = "#ff3300";
                // Cuerpo tipo rombo/púa, para distinguirlo de los cuadrados de lentos/rojos
                ctx.beginPath();
                ctx.moveTo(0, -b.size/2);
                ctx.lineTo(b.size/2, 0);
                ctx.lineTo(0, b.size/2);
                ctx.lineTo(-b.size/2, 0);
                ctx.closePath();
                ctx.fill();
                // Núcleo interior brillante
                ctx.fillStyle = `rgba(255,255,${180 + Math.round(50 * blink)},0.9)`;
                ctx.beginPath();
                ctx.arc(0, 0, b.size/5, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
            ctx.shadowBlur = 0;
        }

        // DIBUJADO
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            let gradient = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
            gradient.addColorStop(0, "#0a0a2a");
            gradient.addColorStop(1, "#1a0a2a");
            ctx.fillStyle = gradient;
            ctx.fillRect(0,0,canvas.width,canvas.height);

            // TEXTO DE FONDO (Complejo.Texto) — va detrás de todo lo demás
            drawCanvasTextOverlay();
            
            // SOMBRA GLOBAL
            if(shadowEvent.active && shadowEvent.phase === 1) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.beginPath();
                ctx.arc(shadowEvent.safeZone.x, shadowEvent.safeZone.y, shadowEvent.safeZone.radius, 0, Math.PI*2);
                ctx.fillStyle = "rgba(255,255,200,0.4)";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(shadowEvent.safeZone.x, shadowEvent.safeZone.y, shadowEvent.safeZone.radius-5, 0, Math.PI*2);
                ctx.strokeStyle = "yellow";
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.fillStyle = "white";
                ctx.font = "bold 16px monospace";
                ctx.fillText("ZONA SEGURA", shadowEvent.safeZone.x-55, shadowEvent.safeZone.y-60);
            }

            // BANDA DE EXTINCIÓN (Banex)
            if(extinctionEvent.active && extinctionEvent.phase === 1) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0,0,canvas.width,canvas.height);
                const half = extinctionEvent.bandWidth/2;
                ctx.fillStyle = "rgba(255,255,200,0.4)";
                ctx.fillRect(extinctionEvent.x - half, 0, extinctionEvent.bandWidth, canvas.height);
                ctx.strokeStyle = "yellow";
                ctx.lineWidth = 4;
                ctx.strokeRect(extinctionEvent.x - half + 2, 2, extinctionEvent.bandWidth - 4, canvas.height - 4);
                ctx.fillStyle = "white";
                ctx.font = "bold 16px monospace";
                ctx.fillText("ZONA SEGURA", extinctionEvent.x-55, canvas.height/2);
            }
            
            // Asteroide (Rock) y sus escombros
            drawAsteroids();
            drawAsteroidDebris();

            // DASH LASER (destello de trayectoria)
            if(dashTrail.active) {
                // Si tiene equipada la skin "Rastro Redst", se dibuja segmentado en vez del láser normal
                const drewSegmented = Cosmetics.drawSegmentedDashTrail(ctx, dashTrail, PRACTICE_DASH_COLOR);
                if(!drewSegmented) {
                    ctx.beginPath();
                    ctx.moveTo(dashTrail.x1, dashTrail.y1);
                    ctx.lineTo(dashTrail.x2, dashTrail.y2);
                    const intensity = 0.7 + Math.sin(Date.now() * 0.03) * 0.3;
                    ctx.strokeStyle = `rgba(160, 160, 160, ${intensity})`;
                    ctx.lineWidth = 8;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "#a0a0a0";
                    ctx.stroke();
                    // Línea interna más brillante
                    ctx.beginPath();
                    ctx.moveTo(dashTrail.x1, dashTrail.y1);
                    ctx.lineTo(dashTrail.x2, dashTrail.y2);
                    ctx.strokeStyle = `rgba(255, 255, 255, 0.9)`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }
            
            // Items de curación (cuadritos verdes)
            for(let item of healthItems) {
                const alpha = Math.min(1, item.timer / 30);
                ctx.fillStyle = `rgba(0, 255, 0, ${alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = "lime";
                ctx.fillRect(item.x - item.size/2, item.y - item.size/2, item.size, item.size);
                // Brillo interior
                ctx.fillStyle = `rgba(200, 255, 100, ${alpha})`;
                ctx.fillRect(item.x - item.size/4, item.y - item.size/4, item.size/2, item.size/2);
            }
            ctx.shadowBlur = 0;
            
            // Enemigos lentos (Purps) — colores normales, o los de Berserker si la skin "Purpsrker" está equipada
            const purpColors = Cosmetics.getPurpColors("#b77eff", "#ffaaff");
            for(let e of slowEnemies) {
                ctx.fillStyle = purpColors.outer;
                ctx.shadowBlur = 5;
                ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
                ctx.fillStyle = purpColors.inner;
                ctx.fillRect(e.x - e.size/4, e.y - e.size/4, e.size/2, e.size/2);
            }

            // Rebotones (Pepes, inmortales)
            for(let bo of bouncers) {
                ctx.fillStyle = "#ffcc66";
                ctx.shadowBlur = 6;
                ctx.shadowColor = "#ffaa33";
                ctx.fillRect(bo.x - bo.size/2, bo.y - bo.size/2, bo.size, bo.size);
                ctx.fillStyle = "#ffe6b3";
                ctx.fillRect(bo.x - bo.size/4, bo.y - bo.size/4, bo.size/2, bo.size/2);
            }
            ctx.shadowBlur = 0;

            // Berserker (Brskr)
            drawBerserkers();
            
            // Proyectiles rápidos
            for(let b of bulletEnemies) {
                if(b.state === 'aiming') {
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    ctx.lineTo(b.targetX, b.targetY);
                    ctx.strokeStyle = `rgba(255,0,0,${0.5+Math.sin(Date.now()*0.01)*0.3})`;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([10,8]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = "#ff6666";
                } else {
                    ctx.fillStyle = "#ff3300";
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = "red";
                }
                ctx.fillRect(b.x - b.size/2, b.y - b.size/2, b.size, b.size);
            }
            
            // Lasers
            for(let l of lasers) {
                if(l.charge > 0) {
                    ctx.beginPath();
                    ctx.moveTo(l.x1, l.y1);
                    ctx.lineTo(l.x2, l.y2);
                    let intensity = 0.3 + (l.charge/45) * 0.5;
                    ctx.strokeStyle = `rgba(255,150,0,${intensity})`;
                    ctx.lineWidth = 8;
                    ctx.setLineDash([15,10]);
                    ctx.stroke();
                    let patternText = l.pattern === 0 ? "═" : (l.pattern === 1 ? "║" : "╱");
                    ctx.fillStyle = `rgba(255,200,0,${intensity+0.2})`;
                    ctx.font = "20px monospace";
                    ctx.fillText(patternText, (l.x1+l.x2)/2, (l.y1+l.y2)/2);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(l.x1, l.y1);
                    ctx.lineTo(l.x2, l.y2);
                    let color = l.pattern === 0 ? "#ff4444" : (l.pattern === 1 ? "#44ff44" : "#4444ff");
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 5;
                    ctx.setLineDash([]);
                    ctx.stroke();
                }
            }
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;

            // Lasers móviles (Lamov)
            for(let l of movingLasers) {
                if(l.charge > 0) {
                    let intensity = 0.3 + (l.charge / MOVING_LASER_WARMUP) * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(l.x, 0);
                    ctx.lineTo(l.x, canvas.height);
                    ctx.strokeStyle = `rgba(255,150,0,${intensity})`;
                    ctx.lineWidth = 8;
                    ctx.setLineDash([15,10]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(l.x, 0);
                    ctx.lineTo(l.x, canvas.height);
                    let color = l.colorIdx === 0 ? "#ff4444" : (l.colorIdx === 1 ? "#44ff44" : "#4444ff");
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 5;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = color;
                    ctx.stroke();
                }
            }
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
            
            // Jugador
            if(player.invincible > 0 && (Math.floor(Date.now()/50)%2 === 0)) {
                ctx.fillStyle = "#ffffaa";
            } else {
                ctx.fillStyle = "#f0f0f0";
            }
            ctx.shadowBlur = 10;
            ctx.shadowColor = "white";
            ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
            ctx.fillStyle = "#888888";
            ctx.fillRect(player.x - player.size/4, player.y - player.size/4, player.size/2, player.size/2);

            // Mascotas y cosmético equipados (definidos en cosmetics.js)
            Cosmetics.drawMascots(ctx, player.x, player.y, player.size);
            Cosmetics.drawCosmetic(ctx, player.x, player.y, player.size);

            // Dash cooldown
            if(dashCooldown > 0) {
                ctx.fillStyle = "rgba(160,160,160,0.6)";
                ctx.fillRect(10, canvas.height-30, (DASH_COOLDOWN_MAX-dashCooldown)*5, 10);
            }
            
            ctx.shadowBlur = 0;

            // Anillos del golpe (skin-hit-rings) y aura de borde al dashear (skin-border-glow)
            Cosmetics.drawHitParticles(ctx);
            Cosmetics.drawDashBorderGlow(ctx, canvas);

            // CONFETI (Complejo.Confeti) — encima de la jugabilidad
            drawConfetti();

            // Game over
            if(gameOver) {
                ctx.font = "bold 48px monospace";
                ctx.fillStyle = "red";
                ctx.fillText("GAME OVER", canvas.width/2-140, canvas.height/2-40);
                ctx.font = "20px monospace";
                ctx.fillStyle = "white";
                ctx.fillText("Presiona ESPACIO para reiniciar", canvas.width/2-165, canvas.height/2+30);
            }

            // PAUSA: overlay amarillento claro SOBRE toda la escena (no como fondo), con el
            // texto centrado encima de todo lo demás.
            if(paused && !gameOver) {
                ctx.fillStyle = "rgba(255, 250, 180, 0.35)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.font = "bold 56px monospace";
                const pauseText = "PAUSA";
                const textWidth = ctx.measureText(pauseText).width;
                ctx.shadowBlur = 14;
                ctx.shadowColor = "rgba(255,255,150,0.95)";
                ctx.fillStyle = "#332b00";
                ctx.fillText(pauseText, canvas.width/2 - textWidth/2, canvas.height/2 + 20);
                ctx.shadowBlur = 0;

                ctx.font = "16px monospace";
                const hintText = "Presiona ESPACIO para continuar";
                const hintWidth = ctx.measureText(hintText).width;
                ctx.fillStyle = "#332b00";
                ctx.fillText(hintText, canvas.width/2 - hintWidth/2, canvas.height/2 + 55);
            }
        }
        
        // ACTUALIZACIÓN PRINCIPAL
        function update() {
            Cosmetics.updateEffects(canvas.width, canvas.height);
            if(gameOver) return;
            
            if(player.invincible > 0) player.invincible--;
            if(dashCooldown > 0) dashCooldown--;
            
            // Puntos por tiempo sobrevivido
            timeScoreCounter++;
            if(timeScoreCounter >= FRAMES_PER_SECOND) {
                timeScoreCounter -= FRAMES_PER_SECOND;
                addScore(TIME_SCORE_AMOUNT);
            }
            
            // Tiempo de partida (HUD)
            gameTimeFrames++;
            document.getElementById('gameTime').innerText = formatGameTime(gameTimeFrames);
            
            updatePlayerMovement();
            updateSlowEnemies();
            updateBulletEnemies();
            updateLasers();
            updateShadowEvent();
            updateExtinctionEvent();
            updateMovingLasers();
            updateBouncers();
            updateAsteroids();
            updateAsteroidDebris();
            updateBerserkers();
            updateSpawners();
            updateHealthItems();
            updateDashTrail();
            updateConfetti();
            updateCanvasTextOverlay();
            updateListRunner();
            
            // Colisiones proyectil-enemigo lento
            for(let i=0; i<bulletEnemies.length; i++) {
                if(bulletEnemies[i].state === 'shooting') {
                    for(let j=0; j<slowEnemies.length; j++) {
                        if(Math.hypot(bulletEnemies[i].x - slowEnemies[j].x, bulletEnemies[i].y - slowEnemies[j].y) < 18) {
                            slowEnemies.splice(j,1);
                            addScore(50);
                            break;
                        }
                    }
                }
            }
            
            updateDamageFlash();
        }
        
        // ---------- INPUTS TÁCTILES (joystick + cruz de dash) ----------
        let joystick = { active: false, touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };
        const JOY_RADIUS = 40; // radio máximo de desplazamiento del knob (px)

        function updateJoystick(clientX, clientY, joystickKnob) {
            let dx = clientX - joystick.baseX;
            let dy = clientY - joystick.baseY;
            let dist = Math.hypot(dx, dy);
            if(dist > JOY_RADIUS) {
                dx = dx / dist * JOY_RADIUS;
                dy = dy / dist * JOY_RADIUS;
            }
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.dx = dx / JOY_RADIUS;
            joystick.dy = dy / JOY_RADIUS;
        }

        if(isMobile) {
            const joystickZone = document.getElementById('joystickZone');
            const joystickBase = document.getElementById('joystickBase');
            const joystickKnob = document.getElementById('joystickKnob');

            function resetJoystickKnob() {
                joystick.active = false;
                joystick.touchId = null;
                joystick.dx = 0;
                joystick.dy = 0;
                joystickKnob.style.transform = 'translate(0px, 0px)';
            }

            joystickZone.addEventListener('touchstart', (e) => {
                if(inMenu) return;
                if(gameOver) { resetGame(); e.preventDefault(); return; }
                const touch = e.changedTouches[0];
                joystick.active = true;
                joystick.touchId = touch.identifier;
                const rect = joystickBase.getBoundingClientRect();
                joystick.baseX = rect.left + rect.width/2;
                joystick.baseY = rect.top + rect.height/2;
                updateJoystick(touch.clientX, touch.clientY, joystickKnob);
                e.preventDefault();
            }, {passive:false});

            joystickZone.addEventListener('touchmove', (e) => {
                if(!joystick.active) return;
                for(const touch of e.changedTouches) {
                    if(touch.identifier === joystick.touchId) {
                        updateJoystick(touch.clientX, touch.clientY, joystickKnob);
                    }
                }
                e.preventDefault();
            }, {passive:false});

            const endJoystickTouch = (e) => {
                for(const touch of e.changedTouches) {
                    if(touch.identifier === joystick.touchId) {
                        resetJoystickKnob();
                    }
                }
                e.preventDefault();
            };
            joystickZone.addEventListener('touchend', endJoystickTouch, {passive:false});
            joystickZone.addEventListener('touchcancel', endJoystickTouch, {passive:false});

            // ---- Dash por deslizamiento (swipe) en el lado derecho de la pantalla ----
            const swipeZone = document.getElementById('swipeZone');
            const SWIPE_MIN_DIST = 45; // px mínimos para que cuente como dash (evita toques accidentales)
            let swipe = { active: false, touchId: null, startX: 0, startY: 0 };

            swipeZone.addEventListener('touchstart', (e) => {
                if(inMenu) return;
                if(gameOver) { resetGame(); e.preventDefault(); return; }
                const touch = e.changedTouches[0];
                swipe.active = true;
                swipe.touchId = touch.identifier;
                swipe.startX = touch.clientX;
                swipe.startY = touch.clientY;
                e.preventDefault();
            }, {passive:false});

            swipeZone.addEventListener('touchmove', (e) => {
                e.preventDefault(); // evita que la pantalla haga scroll al deslizar
            }, {passive:false});

            const finishSwipe = (e) => {
                if(!swipe.active) return;
                for(const touch of e.changedTouches) {
                    if(touch.identifier !== swipe.touchId) continue;
                    if(!inMenu) {
                        const dx = touch.clientX - swipe.startX;
                        const dy = touch.clientY - swipe.startY;
                        const dist = Math.hypot(dx, dy);
                        if(dist >= SWIPE_MIN_DIST) {
                            initMusic();
                            let dirX = 0, dirY = 0;
                            if(Math.abs(dx) > Math.abs(dy)) {
                                dirX = dx > 0 ? 1 : -1;
                            } else {
                                dirY = dy > 0 ? 1 : -1;
                            }
                            performDash(dirX, dirY);
                        }
                    }
                    swipe.active = false;
                    swipe.touchId = null;
                }
                e.preventDefault();
            };
            swipeZone.addEventListener('touchend', finishSwipe, {passive:false});
            swipeZone.addEventListener('touchcancel', () => {
                swipe.active = false;
                swipe.touchId = null;
            }, {passive:false});

            // ---- Pausa/despausa tocando la zona central del canvas (sin espaciadora) ----
            const pauseZone = document.getElementById('pauseZone');
            pauseZone.addEventListener('touchstart', (e) => {
                if(inMenu) return;
                if(gameOver) {
                    resetGame();
                } else {
                    initMusic();
                    togglePause();
                }
                e.preventDefault();
            }, {passive:false});
        }

        // INPUTS
        window.addEventListener('keydown', (e) => {
            if(inMenu) return;
            let key = e.key;

            // ESPACIO: si es game over reinicia; si no, pausa/despausa. Se procesa siempre,
            // incluso con el juego pausado (para poder despausar).
            if(key === ' ' || key === 'Spacebar') {
                e.preventDefault();
                if(gameOver) {
                    resetGame();
                } else {
                    initMusic();
                    togglePause();
                }
                return;
            }

            if(paused) return;
            
            if(key === 'w') move.up = true;
            if(key === 's') move.down = true;
            if(key === 'a') move.left = true;
            if(key === 'd') move.right = true;
            
            let dashX = 0, dashY = 0;
            if(key === 'ArrowUp') dashY = -1;
            if(key === 'ArrowDown') dashY = 1;
            if(key === 'ArrowLeft') dashX = -1;
            if(key === 'ArrowRight') dashX = 1;
            if((dashX !== 0 || dashY !== 0)) {
                performDash(dashX, dashY);
                e.preventDefault();
            }
            if(key.startsWith('Arrow')) e.preventDefault();
        });
        
        window.addEventListener('keyup', (e) => {
            if(e.key === 'w') move.up = false;
            if(e.key === 's') move.down = false;
            if(e.key === 'a') move.left = false;
            if(e.key === 'd') move.right = false;
        });
        
        canvas.addEventListener('click', () => {
            if(gameOver) {
                resetGame();
            } else {
                initMusic();
            }
        });
        
        canvas.addEventListener('click', () => {
            initMusic();
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {}
        });
        
        // LOOP (limitado a 60 FPS máximo en cualquier dispositivo, sin importar
        // la tasa de refresco de la pantalla — algunos celus/monitores van a 90-144Hz,
        // y como la física está atada a los frames, eso haría el juego más rápido de la cuenta)
        const TARGET_FPS = 60;
        const FRAME_DURATION = 1000 / TARGET_FPS;
        let lastFrameTime = 0;

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);

            if(!lastFrameTime) lastFrameTime = timestamp;
            const elapsed = timestamp - lastFrameTime;
            if(elapsed < FRAME_DURATION) return;
            lastFrameTime = timestamp - (elapsed % FRAME_DURATION);

            if(!inMenu) {
                if(!paused) update();
                draw();
            }
        }
        
        showGameScreen();
        resetGame();
        requestAnimationFrame(gameLoop);
    })();
</script>
