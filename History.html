<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BulletDasher - Modo Historia</title>
    <link rel="icon" type="image/svg+xml" href="player-icon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            font-family: monospace;
        }

        #historyMenu {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: monospace;
            text-align: center;
            padding: 90px 20px 40px;
            overflow-y: auto;
        }

        #historyMenu::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.04), transparent 45%);
            pointer-events: none;
        }

        /* ===== Botón de volver al menú ===== */
        #backBtn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            background: rgba(255,0,0,0.08);
            color: #ff4444;
            border: 2px solid #ff0000;
            border-radius: 8px;
            font-size: 22px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,0,0,0.6), inset 0 0 10px rgba(255,0,0,0.25);
            text-shadow: 0 0 8px #ff0000;
            transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease, color 0.2s ease;
        }

        #backBtn:hover {
            background: rgba(255,0,0,0.22);
            box-shadow: 0 0 22px rgba(255,0,0,0.9), inset 0 0 15px rgba(255,0,0,0.4);
            transform: scale(1.08);
            color: #ffaaaa;
        }

        /* ===== Título ===== */
        .history-title {
            position: relative;
            font-size: 56px;
            color: #f2f2f2;
            text-shadow:
                0 0 10px #ffffff,
                0 0 20px #ffffff,
                0 0 40px #cfcfcf,
                0 0 80px #aaaaaa;
            letter-spacing: 4px;
            margin-bottom: 45px;
            animation: whiteNeonPulse 2.4s ease-in-out infinite;
        }

        @keyframes whiteNeonPulse {
            0%, 100% {
                text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 40px #cfcfcf, 0 0 80px #aaaaaa;
            }
            50% {
                text-shadow: 0 0 6px #ffffff, 0 0 14px #ffffff, 0 0 26px #cfcfcf, 0 0 50px #aaaaaa;
            }
        }

        /* ===== Grilla de capítulos ===== */
        .chapter-grid {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 26px;
            justify-content: center;
            max-width: 900px;
        }

        .chapter-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            width: 380px;
            padding: 16px;
            background: rgba(120,120,120,0.06);
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.6), inset 0 0 8px rgba(255,255,255,0.03);
            cursor: default;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .chapter-card:hover {
            transform: scale(1.08);
            border-color: #8a8a8a;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 20px rgba(255,255,255,0.35), inset 0 0 12px rgba(255,255,255,0.08);
        }

        .chapter-thumb {
            flex-shrink: 0;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            border: 2px dashed #3a3a3a;
            border-radius: 6px;
            color: #4d4d4d;
            font-size: 36px;
            font-weight: bold;
            margin-right: 18px;
        }

        .chapter-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            min-width: 0;
        }

        .chapter-name {
            color: #d9d9d9;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(255,255,255,0.4);
            margin-bottom: 6px;
        }

        .chapter-status {
            color: #8a8a8a;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 640px) {
            #historyMenu {
                padding: 80px 16px 40px;
            }

            .history-title {
                font-size: 36px;
                letter-spacing: 2px;
                margin-bottom: 30px;
            }

            #backBtn {
                width: 40px;
                height: 40px;
                top: 14px;
                left: 14px;
                font-size: 18px;
            }

            .chapter-card {
                width: 100%;
                max-width: 340px;
            }

            .chapter-thumb {
                width: 70px;
                height: 70px;
                font-size: 28px;
                margin-right: 14px;
            }

            .chapter-name {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<button id="backBtn" title="Volver al menú">←</button>
<div id="historyMenu">
    <h1 class="history-title">Capítulos</h1>
    <div class="chapter-grid">
        <div class="chapter-card">
            <div class="chapter-thumb">?</div>
            <div class="chapter-info">
                <div class="chapter-name">???</div>
                <div class="chapter-status">Coming Soon</div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
