<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fondo transparente (sin rect de fondo) -->

  <!-- cuerpo del jugador: cuadrado blanco con glow -->
  <rect x="14" y="14" width="36" height="36" fill="#f0f0f0" filter="url(#glow)"/>

  <!-- núcleo naranja-rojizo (Inferno) -->
  <rect x="23" y="23" width="18" height="18" fill="#ff6a00"/>
</svg>
